<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trilha: do zero ao vestibular (ENEM, OBMEP, Provão Paulista)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌿%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F5F7FC;--grid:#E2E7F3;--surface:#FFFFFF;--surface2:#EEF2FC;--ink:#152042;--muted:#56617F;--line:#CBD3E8;
  --brand:#2544D0;--on-brand:#FFFFFF;--hl:#FFE270;--hl-soft:#FFF6CC;--ok:#12804F;--ok-bg:#E2F5EB;--bad:#C92F3C;--bad-bg:#FCE7E9;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --doc:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
    --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
  --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--brand)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin-bottom:.45em}
h1:focus{outline:none}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1.5px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;text-decoration:none;color:var(--ink);padding:0 5px;
  background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface2);font-weight:700}
.n{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;text-align:center}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

/* Elementos comuns */
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.small{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:.3em}
.meta{font-size:.88rem;color:var(--muted);margin:0 0 .5em}
.sec{margin:38px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);
  background:var(--brand);color:var(--on-brand);font:700 .95rem var(--ui);cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.chip{display:inline-block;background:var(--hl);color:#152042;border:1.5px solid var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hl)}
.pct{font-weight:700;font-size:.9rem;min-width:3ch;text-align:right}
.callout{border:1.5px dashed var(--ink);border-radius:12px;padding:12px 16px;margin-top:22px;background:var(--surface2)}
.callout.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.ok-pill{display:inline-block;padding:8px 14px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-weight:700;border:1.5px solid var(--ok)}

/* Cadernos (cartões de curso) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.nb{display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:6px 16px 16px 6px;
  text-decoration:none;color:var(--ink);overflow:hidden;min-height:156px}
.nb:hover{border-color:var(--ink)}
.cover{position:relative;background:hsl(var(--h) 55% 36%);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--doc);font-weight:600;font-size:1.35rem;padding-left:14px}
.cover::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:10px;
  background:radial-gradient(circle at 5px 50%,var(--surface) 3.6px,transparent 4.4px) 0 0/10px 26px repeat-y}
.nb-b{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.nb-b .desc{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.nb-b .meta{margin-top:auto}

.resume{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--ink);
  border-radius:16px;padding:18px 22px;margin-top:26px;border-left:10px solid hsl(var(--h) 55% 40%)}
.resume>div{flex:1;min-width:240px}
.band{margin-top:44px;padding:26px 22px 30px;background:var(--hl-soft);border:1.5px dashed var(--ink);border-radius:18px}
.band .sec{margin-top:0}
.band p.lead{margin-bottom:20px}

/* Layout de documentação do curso */
.doc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
.side-toggle{display:none;width:100%}
.side .back{display:block;color:var(--ink);text-decoration:none;margin-bottom:10px;font-size:1.05rem}
.side details{border-top:1px solid var(--line);padding:6px 0}
.side summary{cursor:pointer;font-weight:700;padding:6px 2px;display:flex;justify-content:space-between;gap:8px}
.cnt{font-weight:500;color:var(--muted);font-size:.85rem}
.lst{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lst a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem}
.lst a:hover{background:var(--surface2)}
.lst a[aria-current="page"]{background:var(--hl-soft);font-weight:700;box-shadow:inset 3px 0 0 var(--ink)}
.ic{flex:none;width:18px;height:18px;margin-top:2px;color:var(--muted)}
.page{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,40px)}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.prose{font-family:var(--doc);font-size:1.12rem;line-height:1.75;max-width:66ch}
.prose p{margin-bottom:1em}
.vid{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--ink);border-radius:12px;padding:16px 18px;margin:26px 0;background:var(--surface2)}
.vid p{margin:0}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.lv{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.lv ol{padding-left:1.2em;margin:.5em 0}
.lv li{margin-bottom:.3em}
.cta{margin:20px 0 6px}

/* Prova */
fieldset.q{border:1.5px solid var(--line);border-radius:12px;padding:14px 18px 16px;margin:16px 0;min-width:0}
fieldset.q legend{padding:0 6px;font-weight:700;color:var(--muted);font-size:.85rem}
.qt{font-weight:700;margin:2px 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--surface2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.tag{margin-left:auto;font-size:.8rem;white-space:nowrap}
.res{border:1.5px solid;border-radius:14px;padding:16px 20px;margin:0 0 18px}
.res:focus{outline:none}
.res.pass{border-color:var(--ok);background:var(--ok-bg)}
.res.fail{border-color:var(--bad);background:var(--bad-bg)}
.res h2{margin-bottom:6px}

/* Listas: meus cursos e certificados */
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.row .cover{width:56px;height:56px;border-radius:6px 12px 12px 6px;font-size:.95rem;padding-left:10px}
.row .cover::before{left:5px;width:8px;background:radial-gradient(circle at 4px 50%,var(--surface) 2.8px,transparent 3.6px) 0 0/8px 20px repeat-y}
.row h3 a{color:var(--ink);text-decoration:none}
.empty{background:var(--surface);border:1.5px dashed var(--ink);border-radius:16px;padding:28px;text-align:center}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}
.namebox label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.namebox input{font:500 1rem var(--ui);padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);min-width:260px;max-width:100%}
.namebox>div{flex:1;min-width:240px;max-width:420px}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cm{background:#FFFCF2;color:#152042;border:2px solid #152042;border-radius:10px;padding:18px;box-shadow:inset 0 0 0 5px #FFFCF2,inset 0 0 0 6.5px #152042;display:flex;flex-direction:column;gap:4px}
.cm h3{font-family:var(--doc);font-size:1.15rem}
.cm p{margin:0;font-size:.88rem;color:#3a4566}
.cm .btn{margin-top:10px;align-self:flex-start;background:transparent;color:#152042}
.danger{margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}

/* Certificado */
.cert{position:relative;background:#FFFCF2;color:#152042;padding:clamp(28px,6vw,64px);text-align:center;font-family:var(--doc);
  border:2px solid #152042;box-shadow:inset 0 0 0 10px #FFFCF2,inset 0 0 0 12px #152042;line-height:1.5}
.cert p{margin:0 0 .6em}
.c-brand{font-family:var(--ui);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.c-title{font-size:clamp(1.6rem,4.5vw,2.6rem)!important;margin:.4em 0 1em!important}
.c-name{font-size:clamp(1.6rem,4.5vw,2.4rem);font-style:italic;font-weight:600;border-bottom:1.5px solid #152042;display:inline-block;padding:0 .6em .1em;margin:.2em 0 .8em!important}
.c-course{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:600;background:linear-gradient(transparent 58%,#FFE270 58%,#FFE270 92%,transparent 92%);display:inline-block;padding:0 .3em;margin-bottom:.9em!important}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:34px;font-size:.9rem}
.seal{width:84px;height:84px;border-radius:50%;border:3px solid #152042;background:#FFE270;display:grid;place-items:center;font-family:var(--ui);font-weight:800;font-size:.95rem;color:#152042}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:900px){
  .doc{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side-toggle{display:block}
  .side .side-body{display:none;margin-top:12px}
  .side.open .side-body{display:block}
}
@media (max-width:600px){
  .top-in{padding:8px 12px;gap:8px}
  .logo{font-size:1.2rem}
  .tab{padding:8px 10px;font-size:.92rem}
  main{padding:20px 14px 60px}
  .row{grid-template-columns:56px minmax(0,1fr)}
  .row>.btn{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.noprint,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== Versão 2: visual suave e acolhedor ===== */
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface2:#EFEFFA;--ink:#2D3047;--muted:#666A85;--line:#E4E3F2;
  --brand:#5A66D6;--on-brand:#FFFFFF;--hl:#FFE6B0;--hl-soft:#FFF5E0;--ok:#2C8A66;--ok-bg:#E3F4EC;--bad:#C24A5A;--bad-bg:#FBEBEE;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 6px 22px rgba(70,76,140,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171826;--surface:#20223A;--surface2:#292C4A;--ink:#ECEDF8;--muted:#A5A8C6;--line:#34375A;
  --brand:#A9B2FF;--on-brand:#171829;--hl:#4A3F25;--hl-soft:#2B2820;--ok:#6FD0A6;--ok-bg:#17302A;--bad:#FF92A0;--bad-bg:#3A2128;--sh:none}}
:root[data-theme="dark"]{
  --bg:#171826;--surface:#20223A;--surface2:#292C4A;--ink:#ECEDF8;--muted:#A5A8C6;--line:#34375A;
  --brand:#A9B2FF;--on-brand:#171829;--hl:#4A3F25;--hl-soft:#2B2820;--ok:#6FD0A6;--ok-bg:#17302A;--bad:#FF92A0;--bad-bg:#3A2128;--sh:none}
body{background-image:none;font-size:1.02rem}
.top{border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.logo{background:none;padding:0;color:var(--brand);font-size:1.5rem}
.tab{border-radius:99px}
.tab[aria-current="page"]{background:var(--surface2);color:var(--brand)}
.n{background:var(--brand);color:var(--on-brand)}
.icon-btn{border-radius:50%;border-color:var(--line)}
.btn{border:1.5px solid transparent;border-radius:99px;padding:11px 22px;box-shadow:0 3px 10px rgba(90,102,214,.2);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink);box-shadow:none}
.chip{background:var(--hl);color:#4A3B16;border:0;font-weight:800}
:root[data-theme="dark"] .chip{color:#FFE6B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#FFE6B0}}
.bar{border:0;background:var(--surface2);height:10px}
.bar>i{background:linear-gradient(90deg,var(--brand),#8FA0F5);border-radius:99px}
.callout,.vid,.band{border:1px solid var(--line);border-radius:20px}
.callout.ok{border-color:var(--ok)}
.band{background:var(--hl-soft)}
.nb,.page,.side,.row,.lv,.resume,.empty,fieldset.q,.res,.serie,.prep{border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.nb{border-radius:8px 22px 22px 8px;transition:transform .15s,box-shadow .15s}
.nb:hover{border-color:var(--line);transform:translateY(-2px)}
.cover{background:hsl(var(--h) 38% 52%)}
.resume{border-left:8px solid hsl(var(--h) 40% 58%)}
.lv{box-shadow:none;border-radius:18px}
.opt{border-radius:14px;border:1.5px solid var(--line);transition:background .15s}
.opt:hover{background:var(--surface2)}
.lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem}
.opt.ok .lt{background:var(--ok);color:#fff}.opt.bad .lt{background:var(--bad);color:#fff}
.lvl,.dsc{display:inline-block;border-radius:99px;padding:0 9px;font-size:.75rem;margin-left:6px;font-weight:800}
.l1{background:var(--ok-bg);color:var(--ok)}.l2{background:var(--hl);color:#4A3B16}.l3{background:var(--bad-bg);color:var(--bad)}
.dsc{background:var(--surface2);color:var(--muted)}
.ctx{margin:0 0 12px;padding:12px 16px;background:var(--surface2);border-radius:14px;font-family:var(--doc);font-size:1.02rem;line-height:1.6}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--surface2)}
.gr{margin:0 0 12px;padding:12px 16px;background:var(--surface2);border-radius:14px}
.gr figcaption{font-weight:800;margin-bottom:8px;font-size:.92rem}
.gl{display:grid;grid-template-columns:minmax(90px,150px) 1fr 3.2ch;gap:10px;align-items:center;margin:5px 0;font-size:.9rem}
.gb{height:14px;background:var(--surface);border-radius:99px;overflow:hidden}
.gb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mp{margin:0 0 12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.mg{display:grid;gap:3px;width:min(220px,100%)}
.mg i{aspect-ratio:1;border-radius:6px}
.mp ul{list-style:none;margin:0;padding:0;font-size:.9rem}
.mp li{display:flex;gap:8px;align-items:center;margin:3px 0}
.mp li i{width:14px;height:14px;border-radius:4px;display:inline-block}
.m0{background:#7FBF9A}.m1{background:#E8D07E}.m2{background:#B9B3C9}.m3{background:#7FB3E0}
.exp{margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--hl-soft);border-left:4px solid var(--brand);font-size:.96rem}
.prep{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:26px;padding:22px 26px;background:linear-gradient(135deg,var(--surface),var(--surface2));text-decoration:none;color:var(--ink)}
.prep h2{margin:6px 0 4px}.prep p{margin:0;color:var(--muted)}
.serie{padding:20px 24px;margin-bottom:18px;background:var(--surface);border-left:8px solid hsl(var(--h) 40% 58%)}
.serie h2{margin:4px 0 6px}
.serie summary{cursor:pointer;font-weight:800;color:var(--brand);margin:6px 0 10px}
.cont{margin:0 0 14px;padding-left:1.1em;font-size:.95rem}.cont li{margin-bottom:6px}
.fls{display:flex;gap:8px;flex-wrap:wrap}
.fl{font:700 .92rem var(--ui);padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fl.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ar{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.note{font-size:.88rem;color:var(--muted);margin-top:22px}

/* ===== Flashcards ===== */
.fc-wrap{max-width:760px;margin:0 auto}

.fc-mode b{font-size:1.1rem}.fc-mode span{color:var(--muted);font-size:.92rem}
.fc-mode[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2);box-shadow:0 0 0 2px var(--brand)}

.fc-pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.fc-timer i{display:block;height:100%;width:100%;transform-origin:left center;background:var(--ok);will-change:transform}

<script type="text/plain" id="fc-data">
# Geometria | Ângulos complementares e suplementares
F: O ângulo $\alpha$ é suplementar a um ângulo de $125^\circ$. Sabendo que o ângulo $\beta$ é complementar ao ângulo $\alpha$, qual é a medida do ângulo $\beta$?
V: Suplementar ($180^\circ$): $\alpha + 125^\circ = 180^\circ \Rightarrow \alpha = 55^\circ$.
Complementar ($90^\circ$): $\alpha + \beta = 90^\circ \Rightarrow 55^\circ + \beta = 90^\circ \Rightarrow \beta = 35^\circ$.
Resposta: $\beta = 35^\circ$.

# Geometria | Equação com ângulos complementares
F: Dois ângulos agudos em um projeto são complementares. O primeiro mede $(3x + 24^\circ)$ e o segundo mede $(4x - 18^\circ)$. Qual é o valor de $x$ e quanto mede cada ângulo?
V: Soma $= 90^\circ$: $(3x + 24) + (4x - 18) = 90$.
$7x + 6 = 90 \Rightarrow 7x = 84 \Rightarrow x = 12$.
Ângulo 1: $3(12) + 24 = 60^\circ$. Ângulo 2: $4(12) - 18 = 30^\circ$.

# Geometria | Área e perímetro de retângulo
F: Um terreno retangular tem comprimento igual ao triplo de sua largura. Sabendo que o perímetro é $80\text{ m}$, qual é a área total desse terreno?
V: Largura $= x$; comprimento $= 3x$.
Perímetro: $2(x) + 2(3x) = 80 \Rightarrow 8x = 80 \Rightarrow x = 10\text{ m}$.
Dimensões: $10\text{ m}$ por $30\text{ m}$.
Área: $10 \times 30 = 300\text{ m}^2$.

# Geometria | Triângulo e soma dos ângulos internos
F: Em um triângulo, os ângulos internos medem $x$, $2x$ e $(x + 20^\circ)$. Qual é o valor de $x$ e o tipo de triângulo quanto aos ângulos?
V: A soma dos ângulos internos de um triângulo é $180^\circ$.
$x + 2x + x + 20 = 180 \Rightarrow 4x = 160 \Rightarrow x = 40^\circ$.
Ângulos: $40^\circ$, $80^\circ$ e $60^\circ$. Todos menores que $90^\circ$: triângulo acutângulo.

# Física | Conversão de unidades
F: Como converter a velocidade de $\text{km/h}$ para $\text{m/s}$ e vice-versa? Qual é o valor em $\text{m/s}$ de um carro a $108\text{ km/h}$?
V: $\text{km/h} \rightarrow \text{m/s}$: divida por $3,6$.
$\text{m/s} \rightarrow \text{km/h}$: multiplique por $3,6$.
Cálculo: $108 \div 3,6 = 30\text{ m/s}$.

# Física | Velocidade média em etapas
F: Um ônibus percorre os primeiros $100\text{ km}$ de uma viagem em $2\text{ horas}$ e os $80\text{ km}$ seguintes em $1\text{ hora}$. Qual a velocidade média no percurso total?
V: Distância total: $100 + 80 = 180\text{ km}$. Tempo total: $2 + 1 = 3\text{ h}$.
$V_m = \frac{\Delta S}{\Delta t} = \frac{180}{3} = 60\text{ km/h}$.

# Física | Tempo com velocidade constante
F: Um atleta corre com velocidade escalar média constante de $4\text{ m/s}$. Quanto tempo (em minutos) ele leva para percorrer $2,4\text{ km}$?
V: Distância em metros: $2,4\text{ km} = 2400\text{ m}$.
$\Delta t = \frac{\Delta S}{V_m} = \frac{2400}{4} = 600\text{ s}$.
Em minutos: $600 \div 60 = 10\text{ minutos}$.

# Química | Decomposição e conservação de massa
F: Na decomposição do carbonato de cálcio ($\text{CaCO}_3 \rightarrow \text{CaO} + \text{CO}_2$), $100\text{ g}$ de $\text{CaCO}_3$ produzem $56\text{ g}$ de $\text{CaO}$. Qual a massa de $\text{CO}_2$ liberada ao decompor $50\text{ g}$ de $\text{CaCO}_3$?
V: Lei de Lavoisier: $100\text{ g } \text{CaCO}_3 = 56\text{ g } \text{CaO} + 44\text{ g } \text{CO}_2$.
$50\text{ g}$ é metade de $100\text{ g}$, então forma metade do produto: $44 \div 2 = 22\text{ g}$ de $\text{CO}_2$.

# Química | Estequiometria com massa molar
F: Dada a reação balanceada $\text{N}_2 + 3\text{H}_2 \rightarrow 2\text{NH}_3$ (massas molares: $\text{N}_2 = 28\text{ g/mol}$, $\text{H}_2 = 2\text{ g/mol}$), qual a massa de hidrogênio necessária para reagir completamente com $56\text{ g}$ de nitrogênio?
V: Proporção: $1\text{ mol } \text{N}_2 : 3\text{ mols } \text{H}_2$.
Em massa: $28\text{ g}$ de $\text{N}_2$ reagem com $3 \times 2 = 6\text{ g}$ de $\text{H}_2$.
$56\text{ g}$ é o dobro de $28\text{ g}$, logo: $2 \times 6 = 12\text{ g}$ de $\text{H}_2$.

# Química | Rendimento de reação
F: A queima do metano segue $\text{CH}_4 + 2\text{O}_2 \rightarrow \text{CO}_2 + 2\text{H}_2\text{O}$. Teoricamente, $16\text{ g}$ de metano produzem $44\text{ g}$ de $\text{CO}_2$. Se o rendimento real foi de $80\%$, qual massa de $\text{CO}_2$ foi obtida?
V: Rendimento teórico ($100\%$): $44\text{ g}$ de $\text{CO}_2$.
Rendimento real ($80\%$): $44 \times 0,80 = 35,2\text{ g}$ de $\text{CO}_2$.

# Matemática | Porcentagem sucessiva
F: Um produto de R\$ 200 recebe 15% de desconto. Depois, o preço com desconto sofre um aumento de 10%. Qual o preço final?
V: Desconto de 15%: $200 \times 0,85 = $ R\$ 170.
Aumento de 10%: $170 \times 1,10 = $ R\$ 187.
Atenção: não dá para somar −15% + 10%. O resultado equivale a −6,5% sobre o preço original.

# Matemática | Regra de três inversa
F: Cinco operários constroem um muro em 12 dias. Com 10 operários trabalhando no mesmo ritmo, em quantos dias o muro fica pronto?
V: Mais operários, menos dias: grandezas inversamente proporcionais.
$5 \times 12 = 10 \times x \Rightarrow x = 6$ dias.

# Matemática | Equação do 2º grau
F: Resolva $x^2 - 5x + 6 = 0$.
V: $\Delta = b^2 - 4ac = 25 - 24 = 1$.
$x = \frac{5 \pm 1}{2} \Rightarrow x = 3$ ou $x = 2$.
Conferência: soma das raízes $= -b/a = 5$ e produto $= c/a = 6$.

# Matemática | Teorema de Pitágoras
F: Uma escada de $5\text{ m}$ está apoiada em uma parede, com a base a $3\text{ m}$ da parede. A que altura da parede a escada toca?
V: Hipotenusa$^2$ = cateto$^2$ + cateto$^2$.
$5^2 = 3^2 + h^2 \Rightarrow h^2 = 25 - 9 = 16 \Rightarrow h = 4\text{ m}$.
(Trio pitagórico 3-4-5.)

# Matemática | Média, mediana e moda
F: Em uma prova, cinco alunos tiraram 3, 5, 5, 7 e 10. Calcule a média, a mediana e a moda.
V: Média: $(3+5+5+7+10) \div 5 = 30 \div 5 = 6$.
Mediana (valor central, dados em ordem): $5$.
Moda (valor mais frequente): $5$.

# Matemática | Probabilidade com dois dados
F: Ao lançar dois dados honestos, qual a probabilidade de a soma dos resultados ser 7?
V: Total de resultados: $6 \times 6 = 36$.
Combinações com soma 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6.
$P = \frac{6}{36} = \frac{1}{6} \approx 16,7\%$.

# Matemática | Juros simples
F: Um capital de R\$ 1.000 é aplicado a juros simples de 2% ao mês durante 6 meses. Qual o juro e o montante?
V: $J = C \cdot i \cdot t = 1000 \times 0,02 \times 6 = $ R\$ 120.
Montante: $M = C + J = $ R\$ 1.120.

# Matemática | Círculo: comprimento e área
F: Um círculo tem raio de $7\text{ cm}$. Usando $\pi \approx 3,14$, calcule o comprimento da circunferência e a área.
V: Comprimento: $C = 2\pi r = 2 \times 3,14 \times 7 = 43,96\text{ cm}$.
Área: $A = \pi r^2 = 3,14 \times 49 = 153,86\text{ cm}^2$.

# Matemática | Progressão aritmética
F: Em uma PA, $a_1 = 3$ e razão $r = 4$. Qual o 10º termo e a soma dos 10 primeiros termos?
V: $a_n = a_1 + (n-1)r \Rightarrow a_{10} = 3 + 9 \times 4 = 39$.
$S_n = \frac{(a_1 + a_n) \cdot n}{2} = \frac{(3 + 39) \times 10}{2} = 210$.

# Matemática | Função afim
F: Uma corrida de táxi custa R\$ 5 de bandeirada mais R\$ 3 por km rodado. Escreva a função e calcule o preço de 12 km.
V: $f(x) = 3x + 5$ (coeficiente angular 3 = custo por km; coeficiente linear 5 = valor fixo).
$f(12) = 3 \times 12 + 5 = $ R\$ 41.

# Matemática | Volume e capacidade
F: Uma caixa-d'água tem $2\text{ m}$ de comprimento, $3\text{ m}$ de largura e $1,5\text{ m}$ de altura. Quantos litros cabem nela?
V: $V = 2 \times 3 \times 1,5 = 9\text{ m}^3$.
Como $1\text{ m}^3 = 1000\text{ L}$: $9 \times 1000 = 9000\text{ L}$.

# Física | MRUA (aceleração constante)
F: Um carro parte do repouso com aceleração constante de $2\text{ m/s}^2$. Qual a velocidade e a distância percorrida após $10\text{ s}$?
V: $v = v_0 + at = 0 + 2 \times 10 = 20\text{ m/s}$.
$S = \frac{a t^2}{2} = \frac{2 \times 100}{2} = 100\text{ m}$.

# Física | Segunda Lei de Newton
F: Qual a força resultante sobre um corpo de $5\text{ kg}$ que adquire aceleração de $3\text{ m/s}^2$?
V: $F = m \cdot a = 5 \times 3 = 15\text{ N}$.
(Força resultante em newtons = massa em kg × aceleração em m/s².)

# Física | Energia cinética
F: Calcule a energia cinética de uma bola de $2\text{ kg}$ com velocidade de $3\text{ m/s}$.
V: $E_c = \frac{m v^2}{2} = \frac{2 \times 3^2}{2} = 9\text{ J}$.
Dobrar a velocidade quadruplica a energia cinética.

# Física | Lei de Ohm e potência
F: Um resistor de $20\ \Omega$ é percorrido por corrente de $0,5\text{ A}$. Qual a tensão sobre ele e a potência dissipada?
V: Lei de Ohm: $U = R \cdot i = 20 \times 0,5 = 10\text{ V}$.
Potência: $P = U \cdot i = 10 \times 0,5 = 5\text{ W}$.

# Física | Densidade
F: Um objeto tem massa de $200\text{ g}$ e volume de $250\text{ cm}^3$. Qual a densidade? Ele flutua na água ($1\text{ g/cm}^3$)?
V: $d = \frac{m}{V} = \frac{200}{250} = 0,8\text{ g/cm}^3$.
Como $0,8 < 1$, o objeto é menos denso que a água e flutua.

# Física | Queda livre
F: Um objeto é solto do repouso e cai por $3\text{ s}$ (use $g = 10\text{ m/s}^2$, sem resistência do ar). Qual a velocidade final e a altura da queda?
V: $v = g t = 10 \times 3 = 30\text{ m/s}$.
$h = \frac{g t^2}{2} = \frac{10 \times 9}{2} = 45\text{ m}$.

# Química | Mol e massa molar
F: A massa molar da água é $18\text{ g/mol}$ (H = 1; O = 16). Quantos mols e quantas moléculas há em $90\text{ g}$ de água? (Constante de Avogadro: $6 \times 10^{23}$)
V: $n = \frac{m}{M} = \frac{90}{18} = 5\text{ mol}$.
Moléculas: $5 \times 6 \times 10^{23} = 3 \times 10^{24}$.

# Química | pH
F: Uma solução tem $[\text{H}^+] = 10^{-3}\text{ mol/L}$. Qual o pH e qual o caráter da solução?
V: $\text{pH} = -\log[\text{H}^+] = 3$.
pH menor que 7 (a 25 °C): solução ácida. pH = 7 é neutro; maior que 7, básico.

# Química | Separação de misturas
F: Qual método separa: (a) água e areia; (b) óleo e água; (c) sal dissolvido em água?
V: (a) Filtração (sólido insolúvel + líquido).
(b) Decantação, com funil de separação (líquidos imiscíveis).
(c) Destilação simples ou evaporação (sólido dissolvido em líquido).

# Química | Ligações químicas
F: Qual o tipo de ligação no NaCl e na H₂O? Justifique.
V: NaCl: ligação iônica, metal + ametal, com transferência de elétrons (Na⁺ e Cl⁻).
H₂O: ligação covalente, ametais compartilhando pares de elétrons.

# Química | Concentração comum
F: Dissolvem-se $20\text{ g}$ de sal em água até completar $500\text{ mL}$ de solução. Qual a concentração em $\text{g/L}$?
V: Volume: $500\text{ mL} = 0,5\text{ L}$.
$C = \frac{m}{V} = \frac{20}{0,5} = 40\text{ g/L}$.

# Biologia | Fotossíntese
F: Escreva a equação geral da fotossíntese. Onde ela ocorre e o que é necessário?
V: $6\text{CO}_2 + 6\text{H}_2\text{O} \rightarrow \text{C}_6\text{H}_{12}\text{O}_6 + 6\text{O}_2$
Ocorre nos cloroplastos (clorofila) e precisa de luz. Produz glicose e libera oxigênio.

# Biologia | Mitose e meiose
F: Qual a diferença entre mitose e meiose quanto ao resultado e à função?
V: Mitose: 2 células-filhas geneticamente idênticas ($2n$); crescimento e regeneração.
Meiose: 4 células haploides ($n$) geneticamente diferentes; formação de gametas.

# Biologia | Fluxo de energia nas cadeias alimentares
F: Se os produtores armazenam $10000\text{ kJ}$, quanto chega ao consumidor secundário, segundo a regra dos 10%?
V: Em cada nível trófico, só cerca de 10% da energia é transferida.
Produtor $10000 \rightarrow$ consumidor primário $1000 \rightarrow$ consumidor secundário $100\text{ kJ}$.

# Biologia | 1ª Lei de Mendel
F: No cruzamento $Aa \times Aa$ (A dominante), quais as proporções genotípicas e fenotípicas dos descendentes?
V: Genótipos: 25% $AA$, 50% $Aa$, 25% $aa$ (1:2:1).
Fenótipos: 75% dominante e 25% recessivo (3:1).

# Linguagens | Figuras de linguagem
F: Diferencie metáfora, comparação, metonímia e hipérbole com um exemplo de cada.
V: Metáfora: comparação implícita ("Seus olhos são um oceano").
Comparação: com conectivo ("Seus olhos são como um oceano").
Metonímia: troca por relação de proximidade ("Li Machado de Assis" = a obra).
Hipérbole: exagero ("Já falei mil vezes").

# Linguagens | Funções da linguagem
F: Relacione as funções da linguagem ao foco: emotiva, referencial, conativa, poética, fática e metalinguística.
V: Emotiva: emissor (1ª pessoa, sentimentos).
Referencial: assunto (informar, 3ª pessoa).
Conativa: receptor (convencer, imperativo).
Poética: a própria forma da mensagem.
Fática: canal ("Alô? Está me ouvindo?").
Metalinguística: o código (a língua explicando a língua).

# Linguagens | Conectivos e coesão
F: Que relação de sentido expressam os conectivos: porém, portanto, porque e embora?
V: Porém (contudo, todavia): oposição.
Portanto (logo): conclusão.
Porque (pois): causa ou explicação.
Embora (conquanto): concessão, uma ressalva que não impede o fato principal.

# Linguagens | Crase
F: Quando ocorre crase? Dê um truque para testar e dois casos em que ela não é usada.
V: Crase = preposição "a" + artigo "a(s)". Exemplo: "Vou à escola".
Teste: troque a palavra feminina por uma masculina. Se surgir "ao", há crase ("Vou ao colégio").
Não ocorre antes de verbo ("Começou a chover") nem antes de palavra masculina ("Andou a pé").

# Linguagens | Variação linguística
F: Quais os tipos de variação linguística (diatópica, diastrática, diafásica e diacrônica)?
V: Diatópica: região ("aipim" × "mandioca").
Diastrática: grupo social, escolaridade, idade.
Diafásica: situação de uso, formal ou informal.
Diacrônica: mudança ao longo do tempo ("vosmecê" → "você").

# História | Revolução Industrial
F: Onde e quando começou a Revolução Industrial? Cite duas consequências sociais.
V: Inglaterra, em meados do século XVIII (cerca de 1760), com carvão e máquina a vapor.
Consequências: urbanização acelerada e formação do proletariado, com longas jornadas e trabalho infantil.

# História | Iluminismo
F: O que defendia o Iluminismo e qual a ideia central de Locke, Montesquieu, Rousseau e Voltaire?
V: Século XVIII: a razão contra o absolutismo e os privilégios.
Locke: direitos naturais (vida, liberdade, propriedade).
Montesquieu: separação dos poderes.
Rousseau: contrato social e soberania popular.
Voltaire: liberdade de expressão e tolerância religiosa.
Influenciou a Revolução Francesa (1789).

# História | Escravidão e abolição no Brasil
F: Ordene as leis do processo de abolição da escravidão no Brasil.
V: 1850: Lei Eusébio de Queirós (fim do tráfico atlântico).
1871: Lei do Ventre Livre.
1885: Lei dos Sexagenários.
1888: Lei Áurea (13 de maio), a abolição definitiva.

# História | Era Vargas
F: Quais as fases da Era Vargas e qual o marco trabalhista do período?
V: 1930–34: Governo Provisório. 1934–37: Governo Constitucional. 1937–45: Estado Novo (ditadura).
Marcos: voto feminino (1932) e a CLT (Consolidação das Leis do Trabalho, 1943).

# História | Guerra Fria
F: O que foi a Guerra Fria e por que foi "fria"?
V: Disputa entre EUA (capitalismo) e URSS (socialismo), de cerca de 1947 a 1991.
"Fria" porque não houve confronto militar direto entre as superpotências: corrida armamentista e espacial, guerras indiretas (Coreia, Vietnã) e o Muro de Berlim (1961–1989).

# História | Constituição de 1988
F: Por que a Constituição de 1988 é chamada de "Constituição Cidadã"?
V: Foi promulgada na redemocratização, após a ditadura militar (1964–1985).
Ampliou direitos e garantias fundamentais (civis, políticos e sociais) e estabeleceu o voto direto e facultativo a partir dos 16 anos.

# Geografia | Coordenadas e fusos horários
F: Em Londres (UTC 0), são 15h. Que horas são em São Paulo (UTC−3)? Qual a diferença entre latitude e longitude?
V: São Paulo está 3 fusos a oeste: $15 - 3 = 12\text{h}$.
Cada fuso tem $15^\circ$ de longitude ($360^\circ \div 24$) = 1 hora.
Latitude: paralelos, norte-sul, 0° no Equador. Longitude: meridianos, leste-oeste, 0° em Greenwich.

# Geografia | Domínios morfoclimáticos do Brasil
F: Associe: Caatinga, Cerrado e Mata Atlântica à sua característica principal.
V: Caatinga: semiárido do Nordeste, vegetação xerófila e adaptada à seca.
Cerrado: savana brasileira, solos ácidos, "berço das águas" (nascentes de grandes bacias).
Mata Atlântica: floresta litorânea, a mais devastada (urbanização e agricultura), hoje restam cerca de 12%.

# Geografia | Fontes de energia
F: Diferencie energia renovável e não renovável e dê exemplos.
V: Renováveis: se regeneram em escala humana: hidráulica, solar, eólica e biomassa (etanol).
Não renováveis: estoques finitos: petróleo, carvão mineral, gás natural e nuclear (urânio).
No Brasil, a matriz elétrica é predominantemente hidrelétrica.

# Sociologia | Clássicos da Sociologia
F: Associe Durkheim, Weber e Marx ao seu conceito central.
V: Durkheim: fato social (normas externas ao indivíduo, coercitivas e gerais).
Weber: ação social (o sentido que o indivíduo dá à sua ação).
Marx: luta de classes e materialismo histórico (burguesia × proletariado).

const COURSES = COURSE_DEFS.map(function(def, di){
  const lv = def.levels.map(function(level, li){
    const topics = level.topics;
    const lessons = topics.map(function(topic){
      return [
        topic,
        'Nesta aula de ' + level.name + ', você estudará ' + topic + '. O conteúdo parte dos fundamentos e desenvolve conceitos, exemplos, resolução de problemas e conexões com os assuntos seguintes. Ao concluir, revise definições, pratique exercícios e tente explicar o conceito com suas próprias palavras.',
        topic + ' aula ' + def.t.toLowerCase()
      ];
    });
    const others = [];
    def.levels.forEach(function(l, i){ if(i !== li) others.push.apply(others, l.topics); });
    const rand = rng(di * 1000 + li * 17 + 7);
    const q = [];
    for(let k = 0; k < 6; k++){
      const correct = topics[(k * 3 + li) % topics.length];
      const opts = [correct];
      let guard = 0;
      while(opts.length < 4 && guard < 200){
        const cand = others[Math.floor(rand() * others.length)];
        if(opts.indexOf(cand) === -1) opts.push(cand);
        guard++;
      }
      const sh = shuffle(opts, rand);
      q.push(['Qual destes tópicos pertence ao nível "' + level.name + '"?', sh, sh.indexOf(correct)]);
    }
    return {name: level.name, l: lessons, q: q};
  });
  return mk(def.id, def.t, def.cat, def.h, def.sym, def.d, lv);
});

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function typeset(){ if(window.MathJax && window.MathJax.typesetPromise){ window.MathJax.typesetPromise().catch(function(){}); } }
let toastTimer;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200); }

function totalLessons(c){ return c.lv.reduce(function(acc, lv){ return acc + lv.l.length; }, 0); }
function courseProgress(c){
  let total = 0, done = 0;
  c.lv.forEach(function(lv, li){
    total += lv.l.length;
    const dm = (state.done[c.id] && state.done[c.id][li]) || {};
    Object.keys(dm).forEach(function(k){ if(dm[k]) done++; });
  });
  return {total: total, done: done, pct: total ? Math.round(done / total * 100) : 0};
}

function setTab(name){
  document.querySelectorAll('.tab').forEach(function(a){
    if(a.dataset.tab === name) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
}
function updateBadges(){
  let my = 0;
  COURSES.forEach(function(c){ if(courseProgress(c).done > 0) my++; });
  let cert = 0;
  COURSES.forEach(function(c){ if(courseProgress(c).pct === 100) cert++; });
  const nm = document.getElementById('n-my'); nm.hidden = !my; nm.textContent = my;
  const nc = document.getElementById('n-cert'); nc.hidden = !cert; nc.textContent = cert;
}
function parseHash(){
  const h = location.hash.replace(/^#/, '') || '/';
  return h.split('/').filter(Boolean);
}

/* =====================================================
   COMPONENTES DE QUIZ
   ===================================================== */
function quizHTML(qs, formId){
  let html = '<form id="' + formId + '">';
  qs.forEach(function(q, qi){
    html += '<fieldset class="q"><legend>Questão ' + (qi+1) + '</legend>';
    html += '<p class="qt">' + esc(q.text) + '</p>';
    q.options.forEach(function(o, oi){
      html += '<label class="opt"><input type="radio" name="q' + qi + '" value="' + oi + '"><span>' + esc(o) + '</span></label>';
    });
    html += '</fieldset>';
  });
  html += '<button class="btn" type="submit">Enviar respostas</button></form>';
  html += '<div id="quiz-res" aria-live="polite"></div>';
  return html;
}
function bindQuiz(qs, formId, onDone){
  const form = document.getElementById(formId);
  if(!form) return;
  form.addEventListener('change', function(e){
    if(e.target && e.target.name){
      const group = form.querySelectorAll('input[name="' + e.target.name + '"]');
      group.forEach(function(inp){
        const lab = inp.closest('.opt');
        if(lab) lab.classList.remove('sel');
      });
      const lab = e.target.closest('.opt');
      if(lab) lab.classList.add('sel');
    }
  });
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    let score = 0;
    const fieldsets = form.querySelectorAll('fieldset.q');
    qs.forEach(function(q, qi){
      const sel = form.querySelector('input[name="q' + qi + '"]:checked');
      const labels = fieldsets[qi].querySelectorAll('.opt');
      labels.forEach(function(lab, oi){
        lab.classList.remove('ok','bad','sel');
        if(oi === q.correct) lab.classList.add('ok');
        else if(sel && parseInt(sel.value,10) === oi) lab.classList.add('bad');
      });
      if(sel && parseInt(sel.value,10) === q.correct) score++;
    });
    const pct = Math.round(score / qs.length * 100);
    const pass = pct >= 70;
    const res = document.getElementById('quiz-res');
    res.innerHTML = '<div class="res ' + (pass ? 'pass' : 'fail') + '" tabindex="-1">' +
      '<h2>' + (pass ? 'Muito bem!' : 'Continue praticando') + '</h2>' +
      '<p>Você acertou ' + score + ' de ' + qs.length + ' (' + pct + '%).</p>' +
      (onDone ? onDone(score, pct) : '') +
      '</div>';
    res.querySelector('.res').focus();
    form.querySelector('button[type=submit]').disabled = true;
  });
}

/* =====================================================
   SIDEBAR E PÁGINAS DE CURSO
   ===================================================== */
function sidebar(c, ref){
  const p = courseProgress(c);
  const levels = c.lv.map(function(lv, li){
    const dm = (state.done[c.id] && state.done[c.id][li]) || {};
    let dc = 0;
    Object.keys(dm).forEach(function(k){ if(dm[k]) dc++; });
    const items = lv.l.map(function(l, i){
      const cur = ref && ref.level === li && ref.lesson === i;
      const done = dm[i];
      return '<a href="#/curso/' + c.id + '/aula/' + li + '/' + i + '"' + (cur ? ' aria-current="page"' : '') + '>' +
        '<span class="lt">' + (done ? '✓' : (i+1)) + '</span><span>' + esc(l[0]) + '</span></a>';
    }).join('');
    return '<details' + (ref && ref.level === li ? ' open' : '') + '>' +
      '<summary>' + esc(lv.name) + ' <span class="cnt">' + dc + '/' + lv.l.length + '</span></summary>' +
      '<div class="lst">' + items + '</div></details>';
  }).join('');
  return '<aside class="side" id="side">' +
    '<button class="btn ghost side-toggle" data-act="side">Menu de aulas</button>' +
    '<div class="side-body">' +
      '<a class="back" href="#/">← Todos os cursos</a>' +
      '<h2>' + esc(c.t) + '</h2>' +
      '<div class="prog"><div class="bar"><i style="width:' + p.pct + '%"></i></div><span class="pct">' + p.pct + '%</span></div>' +
      '<p class="meta">' + p.done + '/' + p.total + ' aulas</p>' +
      levels +
    '</div></aside>';
}
function bindSideToggle(){
  const side = document.getElementById('side');
  if(!side) return;
  const btn = side.querySelector('[data-act=side]');
  if(btn) btn.addEventListener('click', function(){ side.classList.toggle('open'); });
}

function renderCourse(id, ref){
  const c = COURSES.find(function(x){ return x.id === id; });
  if(!c){ app.innerHTML = '<div class="empty"><p>Curso não encontrado.</p><p><a class="btn" href="#/">Voltar</a></p></div>'; return; }
  const p = courseProgress(c);
  let main;

  if(ref && c.lv[ref.level] && c.lv[ref.level].l[ref.lesson]){
    const lv = c.lv[ref.level];
    const lesson = lv.l[ref.lesson];
    const dm = (state.done[c.id] && state.done[c.id][ref.level]) || {};
    const done = !!dm[ref.lesson];
    const prev = ref.lesson > 0 ? '#/curso/' + c.id + '/aula/' + ref.level + '/' + (ref.lesson-1) : null;
    const next = ref.lesson < lv.l.length - 1 ? '#/curso/' + c.id + '/aula/' + ref.level + '/' + (ref.lesson+1) : null;
    const yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(lesson[2]);
    main = '<article class="page">' +
      '<div class="crumb"><a href="#/">Cursos</a> / <a href="#/curso/' + c.id + '">' + esc(c.t) + '</a> / ' + esc(lv.name) + '</div>' +
      '<span class="chip">' + esc(lv.name) + '</span>' +
      '<h1>' + esc(lesson[0]) + '</h1>' +
      '<p class="meta">Aula ' + (ref.lesson+1) + ' de ' + lv.l.length + ' · ' + (done ? 'concluída' : 'não concluída') + '</p>' +
      '<div class="prose"><p>' + esc(lesson[1]) + '</p></div>' +
      '<div class="vid"><p><strong>Vídeo sugerido:</strong> ' + esc(lesson[2]) + '</p>' +
        '<a class="btn" href="' + yt + '" target="_blank" rel="noopener">Buscar no YouTube</a></div>' +
      '<div class="actions">' +
        '<button class="btn" data-act="done"' + (done ? ' disabled' : '') + '>' + (done ? 'Concluída ✓' : 'Marcar como concluída') + '</button>' +
        '<a class="btn ghost" href="#/curso/' + c.id + '/prova/' + ref.level + '">Prova do nível</a>' +
      '</div>' +
      '<div class="pn">' +
        '<span>' + (prev ? '<a class="btn ghost sm" href="' + prev + '">← Anterior</a>' : '') + '</span>' +
        '<span>' + (next ? '<a class="btn ghost sm" href="' + next + '">Próxima →</a>' : '') + '</span>' +
      '</div></article>';
  } else {
    const levels = c.lv.map(function(lv, li){
      const dm = (state.done[c.id] && state.done[c.id][li]) || {};
      let dc = 0;
      Object.keys(dm).forEach(function(k){ if(dm[k]) dc++; });
      const items = lv.l.map(function(l, i){
        return '<li><a href="#/curso/' + c.id + '/aula/' + li + '/' + i + '">' + esc(l[0]) + '</a> ' + (dm[i] ? '✓' : '') + '</li>';
      }).join('');
      const best = state.quiz[c.id] && state.quiz[c.id][li];
      return '<div class="lv"><h3>' + esc(lv.name) + '</h3>' +
        '<p class="small">' + dc + '/' + lv.l.length + ' aulas concluídas' + (best ? ' · melhor prova: ' + best.pct + '%' : '') + '</p>' +
        '<ol>' + items + '</ol>' +
        '<a class="btn sm" href="#/curso/' + c.id + '/prova/' + li + '">Prova do nível</a></div>';
    }).join('');
    main = '<article class="page">' +
      '<div class="crumb"><a href="#/">Cursos</a> / ' + esc(c.t) + '</div>' +
      '<span class="chip">Curso completo</span>' +
      '<h1>' + esc(c.t) + '</h1>' +
      '<p class="lead">' + esc(c.d) + '</p>' +
      '<div class="prog" style="margin:16px 0"><div class="bar"><i style="width:' + p.pct + '%"></i></div><span class="pct">' + p.pct + '%</span></div>' +
      '<p class="meta">' + p.done + ' de ' + p.total + ' aulas concluídas · ' + c.lv.length + ' níveis</p>' +
      (p.pct === 100 ? '<div class="callout ok"><p class="ok-pill">Curso concluído!</p><p><a href="#/certificado/' + c.id + '">Ver certificado</a></p></div>' : '') +
      '<div class="lv-grid">' + levels + '</div>' +
      '</article>';
  }

  app.innerHTML = '<div class="doc">' + sidebar(c, ref) + '<div>' + main + '</div></div>';
  bindSideToggle();

  if(ref){
    const btn = app.querySelector('[data-act=done]');
    if(btn && !btn.disabled){
      btn.addEventListener('click', function(){
        state.done[c.id] = state.done[c.id] || {};
        state.done[c.id][ref.level] = state.done[c.id][ref.level] || {};
        state.done[c.id][ref.level][ref.lesson] = true;
        save(); updateBadges(); toast('Aula concluída!');
        renderCourse(c.id, ref);
      });
    }
  }
}

function renderCourseQuiz(id, level){
  const c = COURSES.find(function(x){ return x.id === id; });
  if(!c || !c.lv[level]){ app.innerHTML = '<div class="empty"><p>Prova não encontrada.</p></div>'; return; }
  const lv = c.lv[level];
  const qs = lv.q.map(function(q){ return {text: q[0], options: q[1], correct: q[2]}; });
  app.innerHTML = '<div class="doc">' + sidebar(c, {level: level, lesson: -1}) + '<div><article class="page">' +
    '<div class="crumb"><a href="#/">Cursos</a> / <a href="#/curso/' + c.id + '">' + esc(c.t) + '</a> / Prova</div>' +
    '<span class="chip">Prova</span>' +
    '<h1>' + esc(c.t) + ' — ' + esc(lv.name) + '</h1>' +
    '<p class="lead">Responda às ' + qs.length + ' questões. A aprovação é a partir de 70%.</p>' +
    quizHTML(qs, 'quiz') +
    '</article></div></div>';
  bindSideToggle();
  bindQuiz(qs, 'quiz', function(score, pct){
    state.quiz[c.id] = state.quiz[c.id] || {};
    state.quiz[c.id][level] = {score: score, total: qs.length, pct: pct, date: Date.now()};
    save();
    return '<p><a class="btn" href="#/curso/' + c.id + '">Voltar ao curso</a></p>';
  });
}

/* =====================================================
   FLASHCARDS
   ===================================================== */
let FC_CACHE = null;
function parseFC(){
  const raw = document.getElementById('fc-data').textContent;
  const cards = [];
  let cur = null;
  raw.split('\n').forEach(function(line){
    const l = line.trim();
    if(!l) return;
    if(l.charAt(0) === '#'){
      if(cur) cards.push(cur);
      const parts = l.slice(1).split('|').map(function(s){ return s.trim(); });
      cur = {cat: parts[0] || 'Geral', title: parts[1] || '', front: '', back: ''};
    } else if(cur){
      if(l.indexOf('F:') === 0) cur.front += (cur.front ? ' ' : '') + l.slice(2).trim();
      else if(l.indexOf('V:') === 0) cur.back += (cur.back ? ' ' : '') + l.slice(2).trim();
      else if(cur.back) cur.back += ' ' + l;
      else cur.front += ' ' + l;
    }
  });
  if(cur) cards.push(cur);
  return cards;
}
function getFC(){ if(!FC_CACHE) FC_CACHE = parseFC(); return FC_CACHE; }

let fcState = {cat:'Todas', i:0, flip:false, ok:0, bad:0};

function renderFlash(){
  const all = getFC();
  const cats = ['Todas'].concat(Array.from(new Set(all.map(function(c){ return c.cat; }))));
  if(cats.indexOf(fcState.cat) === -1) fcState.cat = 'Todas';
  const list = fcState.cat === 'Todas' ? all : all.filter(function(c){ return c.cat === fcState.cat; });
  const catBtns = cats.map(function(cat){
    return '<button class="fl ' + (fcState.cat === cat ? 'on' : '') + '" data-cat="' + esc(cat) + '">' + esc(cat) + '</button>';
  }).join('');

  let body;
  if(fcState.i >= list.length){
    body = '<div class="callout ok"><h2>Sessão concluída!</h2>' +
      '<p>Acertos: ' + fcState.ok + ' · Erros: ' + fcState.bad + ' · Total: ' + list.length + '</p>' +
      '<button class="btn" data-act="restart">Reiniciar</button></div>';
  } else {
    const card = list[fcState.i];
    body = '<div class="fc-top">' +
        '<span class="fc-pill">' + (fcState.i+1) + ' / ' + list.length + '</span>' +
        '<span class="fc-pill ok">✓ ' + fcState.ok + '</span>' +
        '<span class="fc-pill bad">✗ ' + fcState.bad + '</span>' +
      '</div>' +
      '<div class="fc-card ' + (fcState.flip ? 'flip' : '') + '" id="fc-card" tabindex="0" role="button" aria-label="Virar cartão">' +
        '<div class="fc-in">' +
          '<div class="fc-face"><span class="small">' + esc(card.cat) + ' · ' + esc(card.title) + '</span><p class="fc-q">' + esc(card.front) + '</p></div>' +
          '<div class="fc-face fc-back"><span class="small">Resposta</span><div>' + esc(card.back) + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="fc-actions">' +
        '<button class="btn ghost" data-act="flip">Virar</button>' +
        (fcState.flip ? '<button class="btn fc-errb" data-act="bad">Errei</button><button class="btn fc-okb" data-act="ok">Acertei</button>' : '') +
      '</div>' +
      '<p class="fc-info">Clique no cartão para virar.</p>';
  }

  app.innerHTML = '<div class="fc-wrap"><h1>Flashcards</h1>' +
    '<p class="lead">Revise conceitos essenciais de todas as matérias.</p>' +
    '<div class="fls" style="margin:14px 0">' + catBtns + '</div>' + body + '</div>';

  app.querySelectorAll('[data-cat]').forEach(function(b){
    b.addEventListener('click', function(){
      fcState = {cat: b.dataset.cat, i:0, flip:false, ok:0, bad:0};
      renderFlash();
    });
  });
  const cardEl = document.getElementById('fc-card');
  if(cardEl) cardEl.addEventListener('click', function(){ fcState.flip = !fcState.flip; renderFlash(); });
  const bFlip = app.querySelector('[data-act=flip]');
  if(bFlip) bFlip.addEventListener('click', function(e){ e.stopPropagation(); fcState.flip = !fcState.flip; renderFlash(); });
  const bOk = app.querySelector('[data-act=ok]');
  if(bOk) bOk.addEventListener('click', function(e){ e.stopPropagation(); fcState.ok++; fcState.i++; fcState.flip = false; renderFlash(); });
  const bBad = app.querySelector('[data-act=bad]');
  if(bBad) bBad.addEventListener('click', function(e){ e.stopPropagation(); fcState.bad++; fcState.i++; fcState.flip = false; renderFlash(); });
  const bRestart = app.querySelector('[data-act=restart]');
  if(bRestart) bRestart.addEventListener('click', function(){ fcState.i = 0; fcState.flip = false; fcState.ok = 0; fcState.bad = 0; renderFlash(); });

  typeset();
}

/* =====================================================
   BANCO DE QUESTÕES E PROVÃO
   ===================================================== */
function allQuestions(){
  const out = [];
  COURSES.forEach(function(c){
    c.lv.forEach(function(lv, li){
      lv.q.forEach(function(q){
        out.push({c: c, li: li, lv: lv, q: q});
      });
    });
  });
  return out;
}
function toQuiz(qs){
  return qs.map(function(item){
    return {
      text: '[' + item.c.t + ' · ' + item.lv.name + '] ' + item.q[0],
      options: item.q[1],
      correct: item.q[2]
    };
  });
}
function renderBanco(){
  const all = allQuestions();
  const rand = rng((Date.now() % 1000000) + 13);
  const sel = shuffle(all, rand).slice(0, 10);
  const qs = toQuiz(sel);
  app.innerHTML = '<h1>Banco de questões</h1>' +
    '<p class="lead">Dez questões aleatórias de todas as matérias para praticar.</p>' +
    '<div class="sp"><button class="btn ghost" data-act="regen">Gerar novas questões</button></div>' +
    quizHTML(qs, 'bank');
  bindQuiz(qs, 'bank');

}

/* =====================================================
   ROTEADOR
   ===================================================== */
function render(){
  const p = parseHash();
  updateBadges();

  if(p.length === 0){ setTab('home'); renderHome(); }
  else if(p[0] === 'curso'){
    setTab('home');
    if(p[2] === 'aula') renderCourse(p[1], {level: parseInt(p[3],10), lesson: parseInt(p[4],10)});
    else if(p[2] === 'prova') renderCourseQuiz(p[1], parseInt(p[3],10));
    else renderCourse(p[1], null);
  }
  else if(p[0] === 'meus'){ setTab('meus'); renderMeus(); }
  else if(p[0] === 'certificados'){ setTab('cert'); renderCerts(); }
  else if(p[0] === 'certificado'){ setTab('cert'); renderCert(p[1]); }
  else if(p[0] === 'flash'){ setTab('flash'); renderFlash(); }
  else if(p[0] === 'banco'){ setTab('banco'); renderBanco(); }
  else if(p[0] === 'provao'){ setTab('provao'); renderProvao(); }
  else if(p[0] === 'plano'){ setTab('plano'); renderPlano(); }
  else if(p[0] === 'exames'){ setTab('exames'); renderExames(); }
  else if(p[0] === 'professores'){ setTab('prof'); renderProf(); }
  else { setTab('home'); renderHome(); }

  typeset();
  window.scrollTo(0,0);
}

/* Tema */
function applyTheme(){
  if(state.theme) document.documentElement.setAttribute('data-theme', state.theme);
}
applyTheme();
const themeBtn = document.querySelector('[data-act=theme]');
if(themeBtn){
  themeBtn.addEventListener('click', function(){
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme');
    let next;
    if(cur === 'dark') next = 'light';
    else if(cur === 'light') next = 'dark';
    else next = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    state.theme = next; save();
  });
}

window.addEventListener('hashchange', render);
render();

})();
