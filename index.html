<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trilha: cursos e preparação para o Provão Paulista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🌿%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F5F7FC;--grid:#E2E7F3;--surface:#FFFFFF;--surface2:#EEF2FC;--ink:#152042;--muted:#56617F;--line:#CBD3E8;
  --brand:#2544D0;--on-brand:#FFFFFF;--hl:#FFE270;--hl-soft:#FFF6CC;--ok:#12804F;--ok-bg:#E2F5EB;--bad:#C92F3C;--bad-bg:#FCE7E9;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --doc:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
    --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
  --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--brand)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin-bottom:.45em}
h1:focus{outline:none}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1.5px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;text-decoration:none;color:var(--ink);padding:0 5px;
  background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface2);font-weight:700}
.n{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;text-align:center}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

/* Elementos comuns */
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.small{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:.3em}
.meta{font-size:.88rem;color:var(--muted);margin:0 0 .5em}
.sec{margin:38px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);
  background:var(--brand);color:var(--on-brand);font:700 .95rem var(--ui);cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.chip{display:inline-block;background:var(--hl);color:#152042;border:1.5px solid var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hl)}
.pct{font-weight:700;font-size:.9rem;min-width:3ch;text-align:right}
.callout{border:1.5px dashed var(--ink);border-radius:12px;padding:12px 16px;margin-top:22px;background:var(--surface2)}
.callout.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.ok-pill{display:inline-block;padding:8px 14px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-weight:700;border:1.5px solid var(--ok)}

/* Cadernos (cartões de curso) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.nb{display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:6px 16px 16px 6px;
  text-decoration:none;color:var(--ink);overflow:hidden;min-height:156px}
.nb:hover{border-color:var(--ink)}
.cover{position:relative;background:hsl(var(--h) 55% 36%);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--doc);font-weight:600;font-size:1.35rem;padding-left:14px}
.cover::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:10px;
  background:radial-gradient(circle at 5px 50%,var(--surface) 3.6px,transparent 4.4px) 0 0/10px 26px repeat-y}
.nb-b{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.nb-b .desc{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.nb-b .meta{margin-top:auto}

.resume{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--ink);
  border-radius:16px;padding:18px 22px;margin-top:26px;border-left:10px solid hsl(var(--h) 55% 40%)}
.resume>div{flex:1;min-width:240px}
.band{margin-top:44px;padding:26px 22px 30px;background:var(--hl-soft);border:1.5px dashed var(--ink);border-radius:18px}
.band .sec{margin-top:0}
.band p.lead{margin-bottom:20px}

/* Layout de documentação do curso */
.doc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
.side-toggle{display:none;width:100%}
.side .back{display:block;color:var(--ink);text-decoration:none;margin-bottom:10px;font-size:1.05rem}
.side details{border-top:1px solid var(--line);padding:6px 0}
.side summary{cursor:pointer;font-weight:700;padding:6px 2px;display:flex;justify-content:space-between;gap:8px}
.cnt{font-weight:500;color:var(--muted);font-size:.85rem}
.lst{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lst a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem}
.lst a:hover{background:var(--surface2)}
.lst a[aria-current="page"]{background:var(--hl-soft);font-weight:700;box-shadow:inset 3px 0 0 var(--ink)}
.ic{flex:none;width:18px;height:18px;margin-top:2px;color:var(--muted)}
.page{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,40px)}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.prose{font-family:var(--doc);font-size:1.12rem;line-height:1.75;max-width:66ch}
.prose p{margin-bottom:1em}
.vid{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--ink);border-radius:12px;padding:16px 18px;margin:26px 0;background:var(--surface2)}
.vid p{margin:0}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.lv{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.lv ol{padding-left:1.2em;margin:.5em 0}
.lv li{margin-bottom:.3em}
.cta{margin:20px 0 6px}

/* Prova */
fieldset.q{border:1.5px solid var(--line);border-radius:12px;padding:14px 18px 16px;margin:16px 0;min-width:0}
fieldset.q legend{padding:0 6px;font-weight:700;color:var(--muted);font-size:.85rem}
.qt{font-weight:700;margin:2px 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--surface2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.tag{margin-left:auto;font-size:.8rem;white-space:nowrap}
.res{border:1.5px solid;border-radius:14px;padding:16px 20px;margin:0 0 18px}
.res:focus{outline:none}
.res.pass{border-color:var(--ok);background:var(--ok-bg)}
.res.fail{border-color:var(--bad);background:var(--bad-bg)}
.res h2{margin-bottom:6px}

/* Listas: meus cursos e certificados */
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.row .cover{width:56px;height:56px;border-radius:6px 12px 12px 6px;font-size:.95rem;padding-left:10px}
.row .cover::before{left:5px;width:8px;background:radial-gradient(circle at 4px 50%,var(--surface) 2.8px,transparent 3.6px) 0 0/8px 20px repeat-y}
.row h3 a{color:var(--ink);text-decoration:none}
.empty{background:var(--surface);border:1.5px dashed var(--ink);border-radius:16px;padding:28px;text-align:center}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}
.namebox label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.namebox input{font:500 1rem var(--ui);padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);min-width:260px;max-width:100%}
.namebox>div{flex:1;min-width:240px;max-width:420px}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cm{background:#FFFCF2;color:#152042;border:2px solid #152042;border-radius:10px;padding:18px;box-shadow:inset 0 0 0 5px #FFFCF2,inset 0 0 0 6.5px #152042;display:flex;flex-direction:column;gap:4px}
.cm h3{font-family:var(--doc);font-size:1.15rem}
.cm p{margin:0;font-size:.88rem;color:#3a4566}
.cm .btn{margin-top:10px;align-self:flex-start;background:transparent;color:#152042}
.danger{margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}

/* Certificado */
.cert{position:relative;background:#FFFCF2;color:#152042;padding:clamp(28px,6vw,64px);text-align:center;font-family:var(--doc);
  border:2px solid #152042;box-shadow:inset 0 0 0 10px #FFFCF2,inset 0 0 0 12px #152042;line-height:1.5}
.cert p{margin:0 0 .6em}
.c-brand{font-family:var(--ui);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.c-title{font-size:clamp(1.6rem,4.5vw,2.6rem)!important;margin:.4em 0 1em!important}
.c-name{font-size:clamp(1.6rem,4.5vw,2.4rem);font-style:italic;font-weight:600;border-bottom:1.5px solid #152042;display:inline-block;padding:0 .6em .1em;margin:.2em 0 .8em!important}
.c-course{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:600;background:linear-gradient(transparent 58%,#FFE270 58%,#FFE270 92%,transparent 92%);display:inline-block;padding:0 .3em;margin-bottom:.9em!important}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:34px;font-size:.9rem}
.seal{width:84px;height:84px;border-radius:50%;border:3px solid #152042;background:#FFE270;display:grid;place-items:center;font-family:var(--ui);font-weight:800;font-size:.95rem;color:#152042}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:900px){
  .doc{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side-toggle{display:block}
  .side .side-body{display:none;margin-top:12px}
  .side.open .side-body{display:block}
}
@media (max-width:600px){
  .top-in{padding:8px 12px;gap:8px}
  .logo{font-size:1.2rem}
  .tab{padding:8px 10px;font-size:.92rem}
  main{padding:20px 14px 60px}
  .row{grid-template-columns:56px minmax(0,1fr)}
  .row>.btn{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.noprint,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== Versão 2: visual suave e acolhedor ===== */
:root{
  --bg:#F5F4FB;--surface:#FFFFFF;--surface2:#EFEFFA;--ink:#2D3047;--muted:#666A85;--line:#E4E3F2;
  --brand:#5A66D6;--on-brand:#FFFFFF;--hl:#FFE6B0;--hl-soft:#FFF5E0;--ok:#2C8A66;--ok-bg:#E3F4EC;--bad:#C24A5A;--bad-bg:#FBEBEE;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 6px 22px rgba(70,76,140,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171826;--surface:#20223A;--surface2:#292C4A;--ink:#ECEDF8;--muted:#A5A8C6;--line:#34375A;
  --brand:#A9B2FF;--on-brand:#171829;--hl:#4A3F25;--hl-soft:#2B2820;--ok:#6FD0A6;--ok-bg:#17302A;--bad:#FF92A0;--bad-bg:#3A2128;--sh:none}}
:root[data-theme="dark"]{
  --bg:#171826;--surface:#20223A;--surface2:#292C4A;--ink:#ECEDF8;--muted:#A5A8C6;--line:#34375A;
  --brand:#A9B2FF;--on-brand:#171829;--hl:#4A3F25;--hl-soft:#2B2820;--ok:#6FD0A6;--ok-bg:#17302A;--bad:#FF92A0;--bad-bg:#3A2128;--sh:none}
body{background-image:none;font-size:1.02rem}
.top{border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.logo{background:none;padding:0;color:var(--brand);font-size:1.5rem}
.tab{border-radius:99px}
.tab[aria-current="page"]{background:var(--surface2);color:var(--brand)}
.n{background:var(--brand);color:var(--on-brand)}
.icon-btn{border-radius:50%;border-color:var(--line)}
.btn{border:1.5px solid transparent;border-radius:99px;padding:11px 22px;box-shadow:0 3px 10px rgba(90,102,214,.2);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--ink);box-shadow:none}
.chip{background:var(--hl);color:#4A3B16;border:0;font-weight:800}
:root[data-theme="dark"] .chip{color:#FFE6B0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{color:#FFE6B0}}
.bar{border:0;background:var(--surface2);height:10px}
.bar>i{background:linear-gradient(90deg,var(--brand),#8FA0F5);border-radius:99px}
.callout,.vid,.band{border:1px solid var(--line);border-radius:20px}
.callout.ok{border-color:var(--ok)}
.band{background:var(--hl-soft)}
.nb,.page,.side,.row,.lv,.resume,.empty,fieldset.q,.res,.serie,.prep{border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.nb{border-radius:8px 22px 22px 8px;transition:transform .15s,box-shadow .15s}
.nb:hover{border-color:var(--line);transform:translateY(-2px)}
.cover{background:hsl(var(--h) 38% 52%)}
.resume{border-left:8px solid hsl(var(--h) 40% 58%)}
.lv{box-shadow:none;border-radius:18px}
.opt{border-radius:14px;border:1.5px solid var(--line);transition:background .15s}
.opt:hover{background:var(--surface2)}
.lt{flex:none;width:26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:.8rem}
.opt.ok .lt{background:var(--ok);color:#fff}.opt.bad .lt{background:var(--bad);color:#fff}
.lvl,.dsc{display:inline-block;border-radius:99px;padding:0 9px;font-size:.75rem;margin-left:6px;font-weight:800}
.l1{background:var(--ok-bg);color:var(--ok)}.l2{background:var(--hl);color:#4A3B16}.l3{background:var(--bad-bg);color:var(--bad)}
.dsc{background:var(--surface2);color:var(--muted)}
.ctx{margin:0 0 12px;padding:12px 16px;background:var(--surface2);border-radius:14px;font-family:var(--doc);font-size:1.02rem;line-height:1.6}
.tw{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--surface2)}
.gr{margin:0 0 12px;padding:12px 16px;background:var(--surface2);border-radius:14px}
.gr figcaption{font-weight:800;margin-bottom:8px;font-size:.92rem}
.gl{display:grid;grid-template-columns:minmax(90px,150px) 1fr 3.2ch;gap:10px;align-items:center;margin:5px 0;font-size:.9rem}
.gb{height:14px;background:var(--surface);border-radius:99px;overflow:hidden}
.gb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mp{margin:0 0 12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.mg{display:grid;gap:3px;width:min(220px,100%)}
.mg i{aspect-ratio:1;border-radius:6px}
.mp ul{list-style:none;margin:0;padding:0;font-size:.9rem}
.mp li{display:flex;gap:8px;align-items:center;margin:3px 0}
.mp li i{width:14px;height:14px;border-radius:4px;display:inline-block}
.m0{background:#7FBF9A}.m1{background:#E8D07E}.m2{background:#B9B3C9}.m3{background:#7FB3E0}
.exp{margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--hl-soft);border-left:4px solid var(--brand);font-size:.96rem}
.prep{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:26px;padding:22px 26px;background:linear-gradient(135deg,var(--surface),var(--surface2));text-decoration:none;color:var(--ink)}
.prep h2{margin:6px 0 4px}.prep p{margin:0;color:var(--muted)}
.serie{padding:20px 24px;margin-bottom:18px;background:var(--surface);border-left:8px solid hsl(var(--h) 40% 58%)}
.serie h2{margin:4px 0 6px}
.serie summary{cursor:pointer;font-weight:800;color:var(--brand);margin:6px 0 10px}
.cont{margin:0 0 14px;padding-left:1.1em;font-size:.95rem}.cont li{margin-bottom:6px}
.fls{display:flex;gap:8px;flex-wrap:wrap}
.fl{font:700 .92rem var(--ui);padding:8px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fl.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ar{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:10px;align-items:center;margin:6px 0;font-size:.92rem}
.note{font-size:.88rem;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<header class="top">

  ['Qual é a melhor estratégia ao começar uma questão de interpretação?',['ler só as alternativas','ler o enunciado e o texto de apoio antes das alternativas','marcar sempre a mesma letra','pular todas as questões de leitura'],1],
  ['A ideia central de um texto é:',['um detalhe secundário','o assunto principal que ele desenvolve','o nome da editora','apenas o último parágrafo'],1],
  ['Uma charge costuma combinar:',['humor e crítica social','apenas dados estatísticos','instruções de receita','artigos de lei'],0],
  ['A principal finalidade de uma notícia é:',['expressar a opinião pessoal do autor','informar fatos recentes','ensinar uma receita','narrar uma ficção'],1]]},
 {l:[
  ['Inferência e sentido das palavras','Inferir é concluir o que não está dito de forma explícita, usando pistas do texto. O sentido de uma palavra depende do contexto: a mesma palavra pode ter significados diferentes.','inferência e sentido das palavras aula vestibular'],
  ['Variação linguística e norma-padrão','A língua varia conforme região, idade, época e situação. Variedades não são erros: cabe adequar a linguagem ao contexto. A norma-padrão é exigida em situações formais e na redação.','variação linguística aula'],
  ['Coesão e coerência','Coesão é a ligação entre as partes do texto por conectivos e pronomes. Coerência é a lógica das ideias. "Portanto" indica conclusão, "porém" indica oposição e "porque" indica causa.','coesão e coerência textual aula']],
  q:[
  ['Inferir um sentido em um texto significa:',['copiar um trecho','concluir informações implícitas a partir de pistas','ignorar o contexto','traduzir palavras'],1],
  ['A variação linguística é:',['um erro que deve sempre ser corrigido','a diferença no uso da língua conforme região, época e situação','apenas o uso de gírias','exclusiva da escrita'],1],
  ['O conectivo "portanto" indica:',['oposição','conclusão','causa','tempo'],1],
  ['A coerência de um texto está relacionada a:',['uso correto de vírgulas','lógica e sentido entre as ideias','letra bonita','tamanho do texto'],1]]},
 {l:[
  ['Romantismo e Realismo','O Romantismo idealiza o amor, a natureza e a pátria (José de Alencar, Castro Alves). O Realismo critica a sociedade com olhar objetivo, e Machado de Assis é seu principal nome no Brasil.','Romantismo Realismo literatura brasileira aula'],
  ['Modernismo brasileiro','Iniciado com a Semana de Arte Moderna de 1922, o Modernismo rompeu com padrões tradicionais, valorizou a língua falada e a identidade nacional. Destacam-se Mário de Andrade e Oswald de Andrade.','Modernismo brasileiro Semana de 22 aula'],
  ['Figuras e funções da linguagem','Metáfora, ironia, hipérbole e metonímia aparecem em textos literários e publicitários. As funções (referencial, emotiva, conativa, poética, entre outras) mostram o objetivo da comunicação.','funções da linguagem figuras de linguagem aula']],
  q:[
  ['Machado de Assis é um dos principais nomes de qual escola literária?',['Realismo','Romantismo','Modernismo','Simbolismo'],0],
  ['A função da linguagem centrada no receptor, que busca convencê-lo, é a:',['emotiva','conativa (apelativa)','poética','metalinguística'],1],
  ['A ironia consiste em:',['dizer o contrário do que se quer expressar','exagerar uma ideia','repetir sons','comparar usando "como"'],0],
  ['Oswald de Andrade é um autor do:',['Barroco','Modernismo','Arcadismo','Naturalismo'],1]]},
 {l:[
  ['Redação: estrutura dissertativo-argumentativa','O texto tem introdução (tema e tese), desenvolvimento (argumentos) e conclusão. Defenda um ponto de vista com clareza, mantenha o tema e use linguagem formal. A redação é aplicada na 3ª série.','redação dissertativo-argumentativa estrutura aula'],
  ['Argumentação e repertório sociocultural','Repertório são conhecimentos (fatos históricos, obras, dados) que sustentam os argumentos. Escolha informações pertinentes ao tema e explique como elas comprovam a sua tese.','repertório sociocultural redação argumentos aula'],
  ['Proposta de intervenção','Conclua com uma solução para o problema discutido, detalhando quem deve agir, o que deve fazer, como e com que finalidade. Propostas específicas convencem mais do que frases genéricas.','proposta de intervenção redação aula']],
  q:[

  ['A proposta de intervenção deve:',['repetir a introdução','apresentar solução detalhada para o problema','trazer um novo tema','terminar com uma pergunta sem resposta'],1]]}

mk('provao-matematica','Provão Paulista: Matemática','provao',250,'x²','Matemática aplicada ao cotidiano, estatística, geometria, funções e probabilidade, no estilo da prova.',[
 {l:[
  ['Problemas do cotidiano e operações','Questões de prova costumam contextualizar a matemática em compras, medidas e receitas. Leia com atenção, identifique os dados, escolha a operação e confira se a resposta faz sentido.','matemática do cotidiano problemas vestibular aula'],
  ['Razão, proporção e porcentagem','Razão compara duas grandezas (3 para 12 é 1/4). Proporção iguala duas razões, e a regra de três resolve problemas em que as grandezas são proporcionais. Porcentagem é razão com denominador 100.','razão proporção porcentagem aula'],
  ['Leitura de gráficos e tabelas','Identifique título, eixos, unidades e legenda antes de calcular. Em gráficos de barras, a altura indica o valor de cada categoria; em gráficos de linha, observe a tendência ao longo do tempo.','interpretação de gráficos e tabelas matemática aula']],
  q:[
  ['Quanto é 15% de 200?',['20','30','15','45'],1],
  ['Qual é a razão entre 3 e 12, na forma simplificada?',['1/3','1/4','1/2','3/4'],1],
  ['2 kg de um produto custam R$ 10. Quanto custam 5 kg?',['R$ 20','R$ 25','R$ 50','R$ 15'],1],
  ['Em um gráfico de barras, a altura de cada barra representa:',['o valor da categoria','apenas decoração','o tempo','sempre 100%'],0]]},
 {l:[
  ['Média, mediana e moda','A média soma os valores e divide pela quantidade. A mediana é o valor central com os dados em ordem. A moda é o valor que mais se repete.','média mediana moda aula'],
  ['Geometria plana: áreas','Áreas aparecem em problemas de piso, terreno e pintura. Retângulo: base × altura; triângulo: base × altura ÷ 2; círculo: π × r². Atenção às unidades de medida.','geometria plana áreas aula vestibular'],
  ['Funções do 1º grau em problemas','Situações com taxa fixa mais valor variável (como uma corrida de aplicativo) são funções do 1º grau: f(x) = ax + b. O coeficiente a é o valor por unidade, e b é a taxa fixa.','função afim problemas aplicados aula']],
  q:[
  ['Qual é a média de 4, 6 e 8?',['5','6','7','8'],1],
  ['Qual é a mediana de 1, 3, 5, 7, 9?',['3','5','7','9'],1],
  ['Qual é a moda de 2, 3, 3, 5, 7?',['2','5','3','7'],2],
  ['Qual é a área de um retângulo de 5 m por 4 m?',['9 m²','18 m²','20 m²','25 m²'],2]]},
 {l:[
  ['Funções do 2º grau','O gráfico é uma parábola: concavidade para cima se a > 0 e para baixo se a < 0. O vértice indica o ponto de máximo ou de mínimo, útil em problemas de otimização.','função quadrática vértice aula vestibular'],
  ['Geometria espacial: volumes','O volume mede a capacidade de um sólido. Cubo: aresta³. Paralelepípedo: comprimento × largura × altura. Cilindro: π × r² × altura. Lembre-se: 1 m³ equivale a 1000 litros.','geometria espacial volume aula'],
  ['Juros simples e compostos','Nos juros simples, o juro incide sempre sobre o valor inicial: J = C · i · t. Nos compostos, incide sobre o montante acumulado: M = C · (1 + i)ᵗ. Os compostos são usados no sistema financeiro.','juros simples e compostos aula']],
  q:[
  ['Uma parábola tem concavidade voltada para cima quando:',['a < 0','a > 0','b > 0','c > 0'],1],
  ['Qual é o volume de um cubo de aresta 3 cm?',['9 cm³','18 cm³','27 cm³','81 cm³'],2],
  ['Qual é o juro simples de R$ 1.000 a 10% ao mês durante 2 meses?',['R$ 100','R$ 200','R$ 210','R$ 1.200'],1],
  ['Qual é o montante de R$ 1.000 a 10% ao mês, a juros compostos, após 2 meses?',['R$ 1.200','R$ 1.210','R$ 1.100','R$ 1.220'],1]]},
 {l:[
  ['Análise combinatória e probabilidade','Use o princípio multiplicativo para contar possibilidades. Probabilidade é a razão entre casos favoráveis e possíveis, e vale sempre entre 0 e 1.','análise combinatória probabilidade aula vestibular'],
  ['Trigonometria e ciclo trigonométrico','Além do triângulo retângulo, a trigonometria descreve fenômenos periódicos no ciclo. Memorize seno, cosseno e tangente de 30°, 45° e 60° e use a relação sen² + cos² = 1.','trigonometria ciclo trigonométrico aula'],
  ['Progressões: PA e PG','Na PA, cada termo soma uma razão constante (2, 5, 8, ... tem razão 3). Na PG, cada termo é multiplicado por uma razão constante (3, 6, 12, ... tem razão 2).','progressão aritmética progressão geométrica aula']],
  q:[
  ['Com 3 camisas e 2 calças, quantos conjuntos diferentes é possível formar?',['5','6','8','3'],1],
  ['Ao lançar uma moeda honesta, qual a probabilidade de sair cara?',['1/4','1/2','1/3','1'],1],
  ['Na PA 2, 5, 8, ..., qual é o 4º termo?',['10','11','12','14'],1],
  ['Na PG 3, 6, 12, ..., qual é a razão?',['2','3','4','6'],0]]}
]),

mk('provao-natureza','Provão Paulista: Ciências da Natureza','provao',175,'Nat','Física, Química e Biologia integradas, com foco em questões contextualizadas.',[
 {l:[
  ['Método científico e unidades de medida','A ciência parte da observação, formula hipóteses, testa com experimentos e comunica resultados. Conhecer as unidades do SI (metro, quilograma, segundo) e seus prefixos é essencial para resolver questões.','método científico unidades de medida aula'],
  ['Matéria, estados físicos e transformações','A matéria muda de estado por fusão, vaporização, condensação e solidificação. Essas são transformações físicas; já as reações químicas formam novas substâncias.','estados físicos da matéria mudanças de estado aula'],
  ['Ecologia: cadeias alimentares','Produtores, consumidores e decompositores formam as cadeias e teias alimentares. A energia flui em um sentido e diminui a cada nível, enquanto a matéria é reciclada.','ecologia cadeia alimentar teia aula']],
  q:[
  ['Qual etapa costuma iniciar o método científico?',['a conclusão','a observação e a formulação de perguntas','a publicação','a premiação'],1],
  ['A passagem do estado líquido para o gasoso é chamada de:',['fusão','solidificação','vaporização','sublimação'],2],
  ['Em uma cadeia alimentar, quem inicia a cadeia?',['decompositores','produtores','predadores','parasitas'],1],
  ['Qual é a unidade de massa no Sistema Internacional?',['grama','quilograma','tonelada','libra'],1]]},
 {l:[
  ['Movimento e forças','Velocidade média é Δs ÷ Δt, e a força resultante é F = m · a. Interprete gráficos de posição e velocidade e identifique as forças que agem sobre um corpo.','cinemática e leis de Newton aula vestibular'],
  ['Reações químicas do cotidiano','Ferrugem, combustão e fermentação são reações químicas. Sinais como mudança de cor, liberação de gás ou calor indicam transformação, sempre com conservação da massa.','reações químicas do cotidiano aula'],
  ['Célula e hereditariedade','O DNA fica no núcleo das células eucariontes e contém os genes. Genes têm alelos, que podem ser dominantes ou recessivos, e definem as características herdadas.','célula DNA hereditariedade aula']],
  q:[
  ['Qual é a expressão da velocidade média?',['v = Δs / Δt','v = Δt / Δs','v = Δs · Δt','v = Δs + Δt'],0],
  ['A formação de ferrugem é um exemplo de:',['fusão','oxidação do ferro','evaporação','sublimação'],1],
  ['Em células eucariontes, o DNA fica principalmente no:',['ribossomo','núcleo','vacúolo','lisossomo'],1],
  ['Uma reação química:',['muda apenas o estado físico','forma novas substâncias','não conserva a massa','cria átomos'],1]]},
 {l:[
  ['Energia e suas transformações','A energia se transforma de uma forma em outra (química, elétrica, térmica, luminosa), mas se conserva. Compare fontes renováveis e não renováveis e seus impactos ambientais.','transformações de energia fontes de energia aula'],
  ['Soluções, ácidos e bases','O pH indica a acidez de uma solução: abaixo de 7 é ácida, 7 é neutra e acima de 7 é básica. Ácidos e bases estão em alimentos, produtos de limpeza e no corpo humano.','pH ácidos e bases aula'],
  ['Saúde pública: vacinas e saneamento','Vacinas criam memória imunológica e previnem doenças infecciosas. O saneamento básico (água tratada e esgoto) reduz doenças como diarreias e hepatite A.','vacinas saneamento básico saúde pública aula']],
  q:[
  ['O princípio de que a energia não é criada nem destruída é o da:',['dissipação total','conservação da energia','criação de energia','extinção de energia'],1],
  ['Uma solução com pH 7 é considerada:',['ácida','neutra','básica','salina'],1],
  ['As vacinas ajudam a prevenir:',['fraturas','doenças infecciosas','daltonismo','miopia'],1],
  ['Um painel fotovoltaico converte:',['energia sonora em elétrica','energia solar em elétrica','calor em massa','vento em luz'],1]]},
 {l:[
  ['Eletricidade e consumo de energia','A potência elétrica mede a energia por segundo. O consumo em kWh é a potência em kW multiplicada pelo tempo em horas: um chuveiro de 2 kW ligado por 3 h consome 6 kWh.','potência elétrica consumo de energia kWh aula'],
  ['Estequiometria e conservação da massa','Pela lei de Lavoisier, a massa se conserva nas reações. A estequiometria usa as proporções da equação balanceada para calcular quantidades de reagentes e produtos.','estequiometria lei de Lavoisier aula'],
  ['Genética, evolução e biotecnologia','A seleção natural favorece os mais adaptados ao ambiente. A biotecnologia usa organismos e técnicas genéticas para produzir insulina, vacinas e alimentos, com debates éticos e ambientais.','genética evolução biotecnologia aula vestibular']],
  q:[
  ['Um chuveiro de 2 kW ligado por 3 h consome:',['5 kWh','6 kWh','1,5 kWh','23 kWh'],1],
  ['A lei da conservação das massas é atribuída a:',['Lavoisier','Newton','Darwin','Mendel'],0],
  ['Alelos são:',['tipos de proteína','formas alternativas de um mesmo gene','cromossomos sexuais','organelas'],1],
  ['A seleção natural favorece os indivíduos:',['maiores, sempre','mais adaptados ao ambiente','mais velhos','menos variáveis'],1]]}
]),

mk('provao-humanas','Provão Paulista: Ciências Humanas','provao',48,'Hum','História, Geografia, Filosofia e Sociologia com foco em contexto e interpretação.',[
 {l:[
  ['Tempo, espaço e fontes','Situe os fatos no tempo (séculos, períodos) e no espaço (mapas, escalas). Fontes primárias foram produzidas na época estudada; as secundárias analisam o passado depois.','fontes históricas mapas tempo e espaço aula vestibular'],
  ['Sociedade e cultura','Cultura é o conjunto de saberes, costumes, valores e formas de expressão de um grupo. Sociedades diferentes criam culturas diferentes, e nenhuma é superior a outra.','conceito de cultura sociologia aula'],
  ['Cidadania e direitos','A Constituição de 1988 garante direitos e deveres, como saúde, educação e voto. Ser cidadão é participar da vida pública e respeitar os direitos dos outros.','cidadania direitos Constituição de 1988 aula']],
  q:[

  ['Cultura pode ser definida como:',['apenas arte erudita','o conjunto de saberes, costumes e valores de um grupo','apenas tradições antigas','apenas a língua falada'],1],
  ['A Constituição Federal de 1988 estabelece:',['apenas deveres','direitos fundamentais e deveres','somente o direito ao voto','apenas impostos'],1],
  ['Um mapa político representa principalmente:',['o relevo','as divisões territoriais','o clima','a vegetação'],1]]},
 {l:[
  ['Filosofia: mito e razão','Os gregos passaram de explicações míticas para a busca racional. Sócrates usava perguntas (maiêutica) para levar o interlocutor a refletir, e Platão fundou a Academia.','filosofia Sócrates Platão aula'],
  ['Sociologia clássica','Durkheim estudou os fatos sociais, Weber a ação social e Marx a luta de classes e o trabalho (mais-valia). Cada autor oferece uma lente para entender a sociedade.','Durkheim Weber Marx sociologia aula'],
  ['Brasil Colônia e Império','A economia colonial se baseou no açúcar, no ouro e no trabalho escravizado. A Independência (1822) inaugurou o Império, que terminou em 1889.','Brasil colônia e Império aula vestibular']],
  q:[

  ['O conceito de "fato social" é associado a:',['Marx','Durkheim','Platão','Darwin'],1],
  ['O conceito de "mais-valia" é central na obra de:',['Weber','Durkheim','Marx','Comte'],2],
  ['O ciclo do açúcar concentrou-se principalmente no:',['Sul','Nordeste','Centro-Oeste','Amazônia'],1]]},
 {l:[
  ['República e Era Vargas','Após a proclamação, a República Velha foi dominada pelas oligarquias. Em 1930, Vargas assumiu o poder e, entre outras medidas, criou a CLT, em 1943.','República Velha Era Vargas aula vestibular'],
  ['Urbanização, migrações e desigualdade','A urbanização acelerada gerou metrópoles e conurbações (junção de áreas urbanas de cidades vizinhas). Também expôs desigualdades no acesso a moradia, transporte e serviços.','urbanização migrações desigualdade aula geografia'],
  ['Meio ambiente e sustentabilidade','O desenvolvimento sustentável busca atender às necessidades atuais sem comprometer as gerações futuras. Envolve uso responsável dos recursos, reciclagem e energias limpas.','sustentabilidade meio ambiente aula']],
  q:[
  ['A Era Vargas começou em:',['1889','1930','1964','1988'],1],
  ['A Consolidação das Leis do Trabalho (CLT) foi criada em:',['1943','1964','1988','1930'],0],
  ['Conurbação é:',['a junção de áreas urbanas de cidades vizinhas','a migração para o campo','um tipo de clima','um bioma'],0],
  ['Desenvolvimento sustentável significa:',['explorar recursos sem limites','atender às necessidades atuais sem comprometer as gerações futuras','proibir toda produção','apenas reciclar'],1]]},
 {l:[
  ['Guerras Mundiais e Guerra Fria','As duas guerras mundiais transformaram fronteiras e poderes. Na Guerra Fria, EUA e URSS disputaram influência política, econômica e militar até a queda do Muro de Berlim (1989) e o fim da URSS (1991).','guerras mundiais guerra fria aula vestibular'],
  ['Globalização e geopolítica','Fluxos de capitais, informações e pessoas conectam o mundo, mas de forma desigual. Blocos econômicos e organizações internacionais influenciam decisões globais.','globalização geopolítica aula vestibular'],
  ['Ditadura, redemocratização e cidadania','O regime militar (1964–1985) restringiu liberdades, principalmente após o AI-5 (1968). Campanhas como as Diretas Já e a Constituição de 1988 reconstruíram a democracia.','ditadura militar Diretas Já Constituição de 1988 aula']],

  ['A campanha Diretas Já defendia:',['reforma agrária','eleições diretas para presidente','o fim da escravidão','a proclamação da República'],1]]}
])

Ar(2,2,'O Teatro do Oprimido, criado por Augusto Boal, propõe que o espectador:',['apenas observe em silêncio','seja substituído por atores profissionais','participe da cena e proponha soluções para conflitos sociais','assista somente a tragédias gregas','evite discutir política'],2,'Boal criou o “espectador-ator”: o público entra em cena e experimenta alternativas, transformando o teatro em ferramenta de debate.'),
Ar(3,3,'Uma obra contemporânea que ocupa uma sala inteira e convida o público a caminhar dentro dela é chamada de:',['instalação','xilogravura','afresco','natureza-morta','retrato'],0,'A instalação transforma o espaço em obra e costuma exigir participação do público, como nas experiências de Hélio Oiticica.'),
Ar(3,3,'A capoeira e o samba de roda são reconhecidos como patrimônio cultural:',['material, por serem edifícios históricos','imaterial, por serem saberes e expressões transmitidos entre gerações','natural, por existirem na natureza','arqueológico, por serem objetos enterrados','industrial, por serem produtos fabricados'],1,'Patrimônio imaterial reúne práticas, saberes e celebrações transmitidos de geração em geração, como a roda de capoeira.'),

En(0,1,'Antes de ler um texto em inglês, observar título, imagens e fonte serve para:',['substituir a leitura do texto','antecipar o assunto e o gênero do texto','traduzir palavra por palavra','memorizar vocabulário isolado','ignorar o contexto'],1,'Pistas externas ativam o conhecimento prévio e ajudam a prever o conteúdo, estratégia chamada de skimming ou predição.'),
En(0,2,'A palavra “actually”, em “Actually, I disagree with you”, significa:',['atualmente','na verdade','ultimamente','recentemente','agora mesmo'],1,'Actually é um falso cognato: significa “na verdade” ou “de fato”. “Atualmente” seria currently.'),
En(1,2,'Esse texto pertence ao gênero:',['notícia','anúncio publicitário','carta formal','poema','receita'],1,'O imperativo (Hurry up), a promoção e o desconto mostram a intenção de convencer o consumidor, característica do anúncio.',{x:'“Sale! Everything 50% off this weekend only. Hurry up before it ends!”'}),
En(1,2,'Em “She usually walks to school, but today she is taking the bus”, os tempos verbais indicam, respectivamente:',['hábito e ação em andamento','ação concluída e plano futuro','ação em andamento e hábito','condição hipotética e hábito','fato concluído e ação em andamento'],0,'“Usually walks” (simple present) mostra rotina; “is taking” (present continuous) mostra ação no momento, confirmada por today.'),
En(2,2,'Em “They went to the beach yesterday”, o verbo went está no:',['simple past','present perfect','future simple','present continuous','past continuous'],0,'Went é o passado irregular de go, e yesterday confirma uma ação concluída no passado.'),
En(2,3,'Em “You should see a doctor”, o modal should expressa:',['obrigação legal','conselho','habilidade','impossibilidade','permissão no passado'],1,'Should indica recomendação ou conselho. A obrigação forte seria expressa por must ou have to.'),
En(3,3,'A ideia expressa por “Although” nesse trecho é de:',['causa','concessão (contraste)','conclusão','tempo','finalidade'],1,'Although introduz uma ideia que contrasta com a principal sem anulá-la: custo inicial maior, mas economia futura.',{x:'“Although renewable energy is more expensive at first, it saves money in the long run.”'}),
En(3,3,'A afirmação sustentada pelo texto é:',['a maioria dos alunos vai a pé','o ônibus é o meio mais usado entre os citados','20% dos alunos usam o ônibus','55% dos alunos caminham','todos usam transporte público'],1,'Os números mostram o ônibus (55%) acima de ir a pé (20%). As demais alternativas invertem ou distorcem os dados.',{x:'“Only 20% of students walk to school, while 55% take the bus.”'}),

Fi(0,1,'A passagem do mito ao logos, na Grécia antiga, significa:',['abandonar toda forma de explicação','substituir explicações sobrenaturais por argumentos racionais','aceitar a tradição sem crítica','negar a existência do conhecimento','restringir o pensamento aos sacerdotes'],1,'O logos (razão, discurso) passa a explicar o mundo por causas naturais e argumentos, em vez de narrativas sobre deuses.'),
Fi(0,2,'A frase “penso, logo existo” é associada a:',['Hume, empirista','Descartes, racionalista','Platão, idealista','Marx, materialista','Sartre, existencialista'],1,'Descartes usou a dúvida metódica e encontrou no pensamento a primeira certeza indubitável.'),
Fi(1,1,'O mito da caverna, de Platão, ilustra:',['a passagem da ignorância das aparências ao conhecimento verdadeiro','o triunfo do empirismo','a origem do Estado','o imperativo categórico','a luta de classes'],0,'O prisioneiro que sai da caverna descobre a realidade para além das sombras, símbolo da ascensão ao conhecimento das ideias.'),
Fi(1,2,'O imperativo categórico de Kant orienta o agente a:',['agir buscando sempre o maior prazer','agir segundo regras que possam valer como lei universal','obedecer ao governante em qualquer caso','seguir apenas as próprias vontades','buscar o lucro'],1,'Para Kant, uma ação é moral se a regra que a orienta puder ser universalizada, independentemente das consequências.'),
Fi(2,2,'Para Hobbes, o Estado soberano se justifica porque:',['o ser humano é naturalmente bom e pacífico','ele evita a guerra de todos contra todos','a propriedade deve ser abolida','o povo deve governar em assembleia permanente','o poder deriva apenas da tradição religiosa'],1,'Hobbes via o estado de natureza como violento: os indivíduos cedem direitos a um soberano em troca de segurança.'),
Fi(2,3,'Hume criticou a ideia de causalidade necessária ao afirmar que:',['a relação causa e efeito é demonstrada pela lógica pura','é um hábito mental formado pela experiência repetida','só existe no mundo das ideias','é inata à alma','Deus a garante'],1,'Para o empirista Hume, observamos a sucessão dos eventos, mas a conexão necessária é projetada pelo hábito.'),
Fi(3,3,'Para o existencialismo de Sartre, a frase significa que o ser humano:',['nasce com natureza fixa e imutável','constrói o que é por suas escolhas e responde por elas','é determinado por Deus','é guiado apenas pelo instinto','não pode ser livre'],1,'Não há essência humana prévia: somos livres e responsáveis por nos definirmos.',{x:'“A existência precede a essência.” (Jean-Paul Sartre)'}),
Fi(3,3,'A expressão “banalidade do mal”, de Hannah Arendt, refere-se a:',['maldade exclusiva de pessoas monstruosas','atos terríveis praticados por pessoas comuns que deixam de pensar criticamente e apenas obedecem','ausência de leis','crença de que o mal não existe','falta de religião'],1,'Ao analisar o julgamento de Eichmann, Arendt mostrou que o mal pode nascer da irreflexão burocrática, não de uma monstruosidade.'),

So(0,1,'Segundo Durkheim, os fatos sociais são:',['individuais, internos e voluntários','coletivos, exteriores ao indivíduo e coercitivos','exclusivamente econômicos','impossíveis de estudar cientificamente','determinados apenas pela biologia'],1,'Normas, leis e costumes existem antes de nós, atuam sobre nós e exercem pressão, mesmo sem percebermos.'),

So(1,2,'O toyotismo se diferencia do fordismo por priorizar:',['produção em massa de produtos padronizados em estoque','produção flexível, sob demanda e com trabalhadores polivalentes','trabalho artesanal individual','linha de montagem rígida com tarefas únicas','ausência de tecnologia'],1,'O toyotismo (just in time) produz conforme a demanda, reduz estoques e exige polivalência, ao contrário da rigidez fordista.'),

So(2,2,'A Lei Maria da Penha (2006) é um exemplo de conquista dos movimentos:',['de mulheres e feministas','exclusivamente estudantis','de proprietários rurais','de empresas de tecnologia','sindicais patronais'],0,'A lei responde à luta contra a violência doméstica e mostra como a ação coletiva pode gerar políticas públicas.'),
So(3,3,'O conceito de “capital cultural”, de Bourdieu, ajuda a explicar que a escola:',['é neutra e iguala todas as origens','pode reproduzir desigualdades ao valorizar saberes mais comuns nas classes favorecidas','não influencia a mobilidade social','existe apenas nas classes altas','não transmite cultura'],1,'Famílias com mais capital cultural (linguagem, hábitos, livros) levam vantagem em um sistema que premia esses códigos.'),

mk('artes','Artes','materia',335,'♪','Movimentos artísticos, modernismo brasileiro, música, teatro, cinema, arte contemporânea e interpretação de imagens, em 4 níveis.',[
 {l:[L('Movimentos artísticos: do Renascimento ao Impressionismo','O Renascimento (séculos XV e XVI) valorizou a razão, a perspectiva e o corpo humano, com Leonardo da Vinci e Michelangelo. O Barroco trouxe contraste de luz e sombra e emoção intensa, como em Caravaggio e Aleijadinho. O Neoclassicismo retomou a ordem greco-romana, o Romantismo exaltou a emoção e o Impressionismo (Monet) pintou a impressão da luz em instantes.'),
  L('Interpretação de imagens','Ler uma imagem é observar antes de concluir: o que está em primeiro plano, quais cores, linhas e formas dominam, qual a técnica e o contexto histórico. Depois, relacione os elementos à mensagem: uma charge usa exagero e ironia, uma propaganda busca convencer, uma pintura pode registrar ou criticar a sociedade. Na prova, a resposta correta é sempre sustentada por algo visível na imagem.')],q:qOf('Artes',0)},
 {l:[L('Modernismo brasileiro e a Semana de 22','A Semana de Arte Moderna (São Paulo, 1922) rompeu com padrões acadêmicos e defendeu uma arte livre e nacional. Tarsila do Amaral (Abaporu), Anita Malfatti, Oswald de Andrade e Mário de Andrade buscaram uma identidade brasileira. O Manifesto Antropófago propôs “devorar” influências estrangeiras e transformá-las em algo novo.'),
  L('Vanguardas europeias e suas influências','O Cubismo (Picasso) fragmenta os objetos em vários pontos de vista; o Expressionismo deforma formas para expressar emoção; o Surrealismo (Dalí) explora sonhos e inconsciente; o Dadaísmo questiona o que é arte. Os modernistas brasileiros reinterpretaram essas vanguardas com temas locais, como Portinari ao retratar trabalhadores e Di Cavalcanti ao retratar o povo.')],q:qOf('Artes',1)},
 {l:[L('Música: elementos, gêneros e cultura brasileira','A música combina altura, duração, intensidade e timbre, organizados em ritmo, melodia e harmonia. No Brasil, samba, choro, baião, bossa nova, MPB e funk traduzem contextos sociais. A Tropicália (1967–68) misturou tradição e vanguarda e criticou a ditadura. Ouvir com atenção é relacionar letra, ritmo e época.'),
  L('Teatro e cinema como linguagens','O teatro nasce na Grécia, com tragédia e comédia, e no Brasil se renova com o Teatro do Oprimido, de Augusto Boal, que transforma o público em participante. O cinema une imagem em movimento, som e montagem: enquadramento, plano e edição criam sentido. O Cinema Novo, de Glauber Rocha, buscava uma imagem brasileira, crítica e de baixo orçamento.')],q:qOf('Artes',2)},
 {l:[L('Arte contemporânea: instalação, performance e arte urbana','A arte contemporânea rompe fronteiras entre linguagens: instalações ocupam espaços, performances usam o corpo e a arte urbana (grafite, lambe-lambe) leva a crítica à rua. No Brasil, Lygia Clark, Hélio Oiticica, Vik Muniz e Os Gêmeos criaram obras que pedem participação do público e questionam o que é arte.'),
  L('Leitura crítica de obras e patrimônio cultural','Analisar uma obra exige cruzar forma, contexto e intenção: quem produziu, quando, para quem e com quais meios. O patrimônio cultural, material e imaterial (como o samba de roda e a capoeira), preserva a memória e a identidade. Questões interdisciplinares ligam arte a história, sociedade e tecnologia.')],q:qOf('Artes',3)}
]),
mk('ingles','Inglês','materia',200,'En','Interpretação textual, vocabulário contextual, gêneros textuais, tempos verbais e compreensão de textos no estilo das provas.',[
 {l:[L('Interpretação textual em inglês: estratégias','Antes de traduzir, observe título, imagens, fonte e gênero: eles antecipam o assunto (skimming). Depois, busque informações específicas (scanning) e identifique a ideia principal de cada parágrafo. Cognatos (information, important) ajudam, mas cuidado com falsos cognatos: actually significa “na verdade”, e não “atualmente”.'),
  L('Vocabulário contextual e palavras de ligação','O sentido de uma palavra depende do contexto: bank pode ser “banco” ou “margem do rio”. Prefixos e sufixos (un-, re-, -ful, -less) ajudam a deduzir significados. Conectivos como however (no entanto), therefore (portanto), although (embora) e because (porque) mostram oposição, conclusão, concessão e causa.')],q:qOf('Inglês',0)},
 {l:[L('Gêneros textuais: notícia, tirinha, anúncio e e-mail','Cada gênero tem finalidade e linguagem próprias: a notícia informa fatos (headline e lead), a tirinha usa humor e imagem, o anúncio persuade e o e-mail pode ser formal ou informal. Reconhecer o gênero ajuda a prever vocabulário e objetivo, em cartazes, posts e letras de música.'),
  L('Presente: simple present e present continuous','Use o simple present para hábitos e verdades gerais (She studies every day) e o present continuous para ações em andamento (She is studying now). Na terceira pessoa, o simple present recebe -s (works) e usa does/doesn’t em perguntas e negações. Palavras como always, usually, now e at the moment indicam o tempo.')],q:qOf('Inglês',1)},
 {l:[L('Passado e futuro','O simple past narra fatos concluídos (I visited São Paulo last year); verbos regulares recebem -ed e os irregulares mudam (go → went). O futuro usa will para previsões e decisões imediatas e be going to para planos (We are going to travel). Marcadores como yesterday, ago, tomorrow e next week guiam a escolha.'),
  L('Present perfect e verbos modais','O present perfect (have/has + particípio) liga passado e presente: I have lived here for five years. Modais expressam obrigação (must, have to), possibilidade (may, might), habilidade (can) e conselho (should). Em textos, o modal revela a atitude do autor: might indica incerteza, must indica certeza ou obrigação.')],q:qOf('Inglês',2)},
 {l:[L('Compreensão de textos longos: argumentos e posicionamento','Em textos argumentativos, identifique a tese, os argumentos e a conclusão. Observe expressões de opinião (in my view, it is clear that) e de dados (according to, studies show). Distinguir fato de opinião e perceber o tom (neutro, irônico, crítico) é decisivo nas questões de inferência.'),
  L('Texto, imagem e gráfico: leitura integrada','As provas combinam texto com infográficos, gráficos e charges. Leia primeiro título e legenda, depois relacione os dados às afirmações. Atenção a palavras que mudam a conclusão, como only, most, less than e at least, e confirme se a alternativa é sustentada pelo texto e não por conhecimento prévio.')],q:qOf('Inglês',3)}
]),

/* =====================================================
   REGRAS DE PROGRESSO
   ===================================================== */
function steps(c){
  const r=[];
  c.lv.forEach((lv,i)=>{
    lv.l.forEach((l,j)=>r.push({type:'aula',i,j,href:`#/curso/${c.id}/aula/${i}-${j}`,label:`Aula ${j+1}: ${l[0]}`}));
    r.push({type:'prova',i,href:`#/curso/${c.id}/prova/${i}`,label:`Prova do nível ${LN(c,i)}`});
  });
  return r;
}
function isDone(c,s){
  const p=P(c.id); if(!p) return false;
  return s.type==='aula' ? !!p.d[s.i+'-'+s.j] : !!(p.q[s.i] && p.q[s.i].ok);
}
function stats(c){
  const st=steps(c); const done=st.filter(s=>isDone(c,s)).length;
  return {total:st.length,done,pct:Math.round(done/st.length*100)};
}
function nextStep(c){ return steps(c).find(s=>!isDone(c,s)) || null; }
function levelDone(c,i){ const p=P(c.id); return !!p && c.lv[i].l.every((_,j)=>p.d[i+'-'+j]); }
function hours(c){
  const l=c.lv.reduce((a,x)=>a+x.l.length,0), q=c.lv.length;
  return Math.max(1,Math.round((l*40+q*20)/60));
}
function checkCert(c){
  const p=P(c.id); if(!p||p.cert) return false;
  const s=stats(c);
  if(s.done===s.total){
    p.cert={at:Date.now(),code:'TRL-'+c.id.replace(/[^a-z]/g,'').slice(0,4).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()};
    save(); return true;
  }
  return false;
}

}
function card(c){
  const p=P(c.id), s=stats(c);
  const nL=c.lv.reduce((a,l)=>a+l.l.length,0);
  return `<a class="nb" href="#/curso/${c.id}" style="--h:${c.h}">
    <div class="cover" aria-hidden="true">${esc(c.sym)}</div>
    <div class="nb-b">
      <h3>${esc(c.t)}</h3>
      <p class="desc">${esc(c.d)}</p>
      <p class="meta">${c.lv.length} níveis, ${nL} aulas, ${c.lv.length} provas${p&&p.cert?' (concluído)':''}</p>
      ${p?bar(s.pct):''}
    </div></a>`;
}

    return `<div class="page"><h1>Certificado indisponível</h1><p class="prose">Conclua todas as aulas e as provas de ${esc(c.t)} para emitir o certificado.</p><a class="btn" href="#/curso/${c.id}">Voltar ao curso</a></div>`;
  }
  return `${nameBox()}
  <div class="actions noprint" style="margin-bottom:18px"><button class="btn" data-act="print">Imprimir ou salvar em PDF</button><a class="btn ghost" href="#/certificados">Todos os certificados</a></div>
  <article class="cert">
    <p class="c-brand">Trilha</p>
    <h1 class="c-title">Certificado de conclusão</h1>
    <p>Certificamos que</p>
    <p class="c-name">${esc(S.name||'Seu nome aqui')}</p>
    <p>concluiu o curso</p>
    <p class="c-course">${esc(c.t)}</p>
    <p>com todas as aulas concluídas e aprovação nas provas dos quatro níveis, em carga horária estimada de ${hours(c)} horas.</p>
    <div class="c-foot"><span>${fmt(p.cert.at)}</span><div class="seal" aria-hidden="true">Trilha</div><span>Código ${esc(p.cert.code)}</span></div>
  </article>`;
}

/* ---------- Curso: barra lateral ---------- */
function side(c,act){
  const p=P(c.id)||{d:{},q:{}}, s=stats(c), n=nextStep(c);
  const openLv = act ? act.i : (n ? n.i : 0);
  const levels=c.lv.map((lv,i)=>{
    const dn=lv.l.filter((_,j)=>p.d[i+'-'+j]).length;
    const all=dn===lv.l.length, ok=p.q[i]&&p.q[i].ok;
    const cur=(t,j)=> act&&act.type===t&&act.i===i&&(t==='prova'||act.j===j) ? ' aria-current="page"':'';
    return `<details ${i===openLv||(n&&n.i===i)?'open':''}><summary><span>${LN(c,i)}</span><span class="cnt">${dn}/${lv.l.length}</span></summary><div class="lst">
      ${lv.l.map((l,j)=>`<a href="#/curso/${c.id}/aula/${i}-${j}"${cur('aula',j)}>${p.d[i+'-'+j]?ICON.done:ICON.todo}<span>${esc(l[0])}</span></a>`).join('')}
      <a href="#/curso/${c.id}/prova/${i}"${cur('prova')}>${ok?ICON.done:(all?ICON.quiz:ICON.lock)}<span>Prova do nível</span></a>
    </div></details>`;
  }).join('');
  return `<aside class="side" id="side">
    <button class="btn ghost side-toggle" data-act="toggleSide" aria-expanded="false">Trilha do curso: ${s.pct}% concluído</button>
    <div class="side-body">
      <a class="back" href="#/curso/${c.id}"><strong>${esc(c.t)}</strong></a>
      ${bar(s.pct)}
      <div style="height:10px"></div>
      ${levels}
    </div></aside>`;
}
function courseShell(c,act,content){ return `<div class="doc">${side(c,act)}<div>${content}</div></div>`; }

function overview(c){
  const p=P(c.id), s=stats(c), n=nextStep(c);
  const lvHtml=c.lv.map((lv,i)=>{
    const pp=p||{d:{},q:{}};
    const dn=lv.l.filter((_,j)=>pp.d[i+'-'+j]).length, qz=pp.q[i];
    const st=qz&&qz.ok?`Prova aprovada (melhor nota: ${qz.best}%)`:(levelDone(c,i)?'Prova liberada':'Prova liberada após concluir as aulas');
    return `<section class="lv"><h3>${LN(c,i)}</h3><p class="meta">${dn} de ${lv.l.length} aulas concluídas</p>
      <ol>${lv.l.map((l,j)=>`<li><a href="#/curso/${c.id}/aula/${i}-${j}">${esc(l[0])}</a>${pp.d[i+'-'+j]?' (feita)':''}</li>`).join('')}</ol>
      <p class="meta" style="margin:0"><a href="#/curso/${c.id}/prova/${i}">${st}</a></p></section>`;
  }).join('');
  const certBox = p&&p.cert
    ? `<div class="callout ok"><strong>Certificado emitido.</strong> <a href="#/certificado/${c.id}">Ver certificado</a></div>`
    : `<div class="callout">Conclua todas as aulas e as quatro provas para emitir o certificado deste curso.</div>`;
  const cta = p&&p.cert && !n ? `<a class="btn" href="#/certificado/${c.id}">Ver certificado</a>`
    : (n ? `<a class="btn" data-act="start" data-id="${c.id}" href="${n.href}">${p?'Continuar':'Iniciar curso'}: ${esc(n.label)}</a>` : '');
  return `<article class="page">
    <nav class="crumb"><a href="#/">Cursos</a> / ${esc(c.t)}</nav>
    ${c.cat==='provao'?'<span class="chip">Provão Paulista</span>':''}
    <h1>${esc(c.t)}</h1>
    <p class="prose">${esc(c.d)}</p>
    ${bar(s.pct)}
    <p class="meta" style="margin-top:6px">${s.done} de ${s.total} etapas concluídas (aulas e provas)</p>
    <div class="cta">${cta}</div>
    <h2 style="margin-top:30px">Trilha do curso</h2>
    <div class="lv-grid">${lvHtml}</div>
    ${certBox}
  </article>`;
}

function lessonView(c,i,j){
  const l=c.lv[i].l[j], p=ensure(c.id), key=i+'-'+j, done=!!p.d[key];
  const direct=/^https?:\/\//.test(l[2]);
  const url=direct?l[2]:'https://www.youtube.com/results?search_query='+encodeURIComponent(l[2]);
  const st=steps(c), idx=st.findIndex(s=>s.type==='aula'&&s.i===i&&s.j===j);
  const prev=st[idx-1], next=st[idx+1];
  const attrs=`data-c="${c.id}" data-i="${i}" data-j="${j}"`;
  return `<article class="page">
    <nav class="crumb" aria-label="Você está aqui"><a href="#/">Cursos</a> / <a href="#/curso/${c.id}">${esc(c.t)}</a> / ${LN(c,i)}</nav>
    <p class="small">Aula ${j+1} de ${c.lv[i].l.length}</p>

    <div class="prose"><p>${esc(l[1])}</p></div>

      : `<button class="btn" data-act="complete" ${attrs}>Concluir aula e continuar</button>`}</div>
    <div class="pn"><span>${prev?`<a href="${prev.href}">Anterior: ${esc(prev.label)}</a>`:''}</span><span>${next?`<a href="${next.href}">Próximo: ${esc(next.label)}</a>`:''}</span></div>

/* ---------- Prova ---------- */
let QZ=null;
function quizView(c,i){
  const lv=c.lv[i], p=ensure(c.id);
  const head=`<nav class="crumb"><a href="#/">Cursos</a> / <a href="#/curso/${c.id}">${esc(c.t)}</a> / ${LN(c,i)}</nav>`;
  if(!levelDone(c,i)){
    const pend=lv.l.map((l,j)=>({l,j})).filter(x=>!p.d[i+'-'+x.j]);
    return `<article class="page">${head}<h1>Prova do nível ${LN(c,i)}</h1><p class="prose">Conclua todas as aulas deste nível para liberar a prova. Faltam:</p>
      <ul class="prose">${pend.map(x=>`<li><a href="#/curso/${c.id}/aula/${i}-${x.j}">${esc(x.l[0])}</a></li>`).join('')}</ul></article>`;
  }
  const key=c.id+'-'+i;
  if(!QZ||QZ.key!==key) QZ={key,order:lv.q.map(q=>shuffle(q[1].map((_,k)=>k))),ans:lv.q.map(()=>null),sent:false,hits:0,pct:0,ok:false,newCert:false};
  const qs=lv.q.map((q,k)=>qHtml(q,k,lv.q.length,QZ)).join('');
  let res='';
  if(QZ.sent){
    const st=steps(c), idx=st.findIndex(s=>s.type==='prova'&&s.i===i), nx=st[idx+1];
    const pc=P(c.id);
    let act='';
    if(QZ.ok){
      if(nx) act+=`<a class="btn" href="${nx.href}">Continuar: ${esc(nx.label)}</a>`;
      if(pc&&pc.cert) act+=` <a class="btn ${nx?'ghost':''}" href="#/certificado/${c.id}">Ver certificado</a>`;
    } else {
      act=`<button class="btn" data-act="retry">Refazer prova</button> <a class="btn ghost" href="#/curso/${c.id}">Rever as aulas</a>`;
    }
    res=`<div class="res ${QZ.ok?'pass':'fail'}" id="res" tabindex="-1"><h2>${QZ.ok?'Aprovado':'Ainda não foi dessa vez'}</h2>
      <p>Você acertou ${QZ.hits} de ${lv.q.length} questões (${QZ.pct}%). A nota mínima é ${MIN(lv.q.length)}%.${QZ.ok?'':' Revise o conteúdo e tente de novo.'}</p>
      ${QZ.newCert?'<p><strong>Você concluiu o curso e conquistou o certificado.</strong></p>':''}
      <div class="actions">${act}</div></div>`;
  }
  const answered=QZ.ans.filter(a=>a!==null).length;
  return `<article class="page">${head}<h1>Prova do nível ${LN(c,i)}</h1>
    <p class="prose" style="margin-bottom:1em">${lv.q.length} questões de múltipla escolha sobre o conteúdo do nível. Para ser aprovado, acerte pelo menos ${MIN(lv.q.length)}%.</p>
    ${res}${qs}
    ${QZ.sent?'':`<div class="actions"><button class="btn" data-act="submitQuiz">Enviar respostas</button><span class="meta" id="cnt" style="margin:0">${answered} de ${lv.q.length} respondidas</span></div>`}
  </article>`;
}

/* =====================================================
   VERSÃO 2: componentes de questão, Provão por série, banco e simulados
   ===================================================== */
const LN=(c,i)=>(c.ln&&c.ln[i])||LV[i];
const MIN=n=>n<=2?50:70;
if(!S.sim) S.sim={};
const NV=['','Fácil','Médio','Difícil'];
const AREA={L:'Linguagens',M:'Matemática',N:'Ciências da Natureza',H:'Ciências Humanas',I:'Interdisciplinar'};
const SIMS={sim1:['Provão I: 1ª série',1],sim2:['Provão II: 2ª série',2],sim3:['Provão III: 3ª série',3],simcum:['Simulado cumulativo',0],banco:['Prática do banco de questões',-1]};
let BF={d:'',n:0};
function tbl(t){return `<div class="tw"><table><thead><tr>${t.h.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.r.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function chart(g){const m=g.max||Math.max(...g.d.map(x=>x[1]));return `<figure class="gr"><figcaption>${esc(g.t)}</figcaption>${g.d.map(([l,v])=>`<div class="gl"><span>${esc(l)}</span><div class="gb"><i style="width:${Math.round(v/m*100)}%"></i></div><b>${v}</b></div>`).join('')}</figure>`;}
function mapa(m){const ks=Object.keys(m.leg);return `<figure class="mp"><div class="mg" style="grid-template-columns:repeat(${m.rows[0].length},1fr)" role="img" aria-label="Mapa temático. Legenda: ${esc(ks.map(k=>m.leg[k]).join(', '))}">${m.rows.join('').split('').map(ch=>`<i class="m${ks.indexOf(ch)}"></i>`).join('')}</div><ul>${ks.map((k,x)=>`<li><i class="m${x}"></i>${esc(m.leg[k])}</li>`).join('')}</ul></figure>`;}
function qHtml(q,k,n,Z){
  const x=q[3]||{};
  const opts=Z.order[k].map((o,pos)=>{
    const chosen=Z.ans[k]===o; let cls='opt', tag='';
    if(Z.sent){ if(o===q[2]){cls+=' ok';tag='<b class="tag">Resposta correta</b>';} else if(chosen){cls+=' bad';tag='<b class="tag">Sua resposta</b>';} }
    else if(chosen) cls+=' sel';
    return `<label class="${cls}"><input type="radio" name="q${k}" value="${o}" data-q="${k}" ${chosen?'checked':''} ${Z.sent?'disabled':''}><b class="lt">${String.fromCharCode(65+pos)}</b><span>${esc(q[1][o])}</span>${tag}</label>`;
  }).join('');
  return `<fieldset class="q"><legend>Questão ${k+1} de ${n}${x.n?`<span class="lvl l${x.n}">${NV[x.n]}</span>`:''}${x.d?`<span class="dsc">${esc(x.d)}</span>`:''}</legend>${x.x?`<blockquote class="ctx">${esc(x.x)}</blockquote>`:''}${x.tb?tbl(x.tb):''}${x.g?chart(x.g):''}${x.m?mapa(x.m):''}<p class="qt">${esc(q[0])}</p>${opts}${Z.sent&&x.e?`<div class="exp"><strong>Explicação.</strong> ${esc(x.e)}</div>`:''}</fieldset>`;
}
function viewProvao(){
  const best=k=>S.sim[k]?`Melhor nota: ${S.sim[k].best}%`:'Ainda sem nota';
  const ser=SER.map(s=>{
    const c=course(s.id), st=stats(c), p=P(c.id);
    const cont=c.lv.map((lv,i)=>`<li><strong>${esc(LN(c,i))}:</strong> ${lv.l.map(l=>esc(l[0])).join('; ')}</li>`).join('');
    return `<section class="serie" style="--h:${c.h}"><span class="chip">${s.serie}</span><h2>${esc(s.t)}</h2><p class="meta">${esc(s.d)}</p>
      <details><summary>Conteúdos e habilidades</summary><ul class="cont">${cont}</ul></details>${bar(st.pct)}
      <div class="actions" style="margin-top:14px"><a class="btn" data-act="start" data-id="${c.id}" href="#/curso/${c.id}">${p?'Continuar trilha':'Começar trilha'}</a><a class="btn ghost" href="#/praticar/${s.sim}">Fazer simulado</a><span class="meta" style="margin:0">${best(s.sim)}</span></div></section>`;
  }).join('');
  const ev={t:'Sua evolução (melhor nota em cada simulado)',max:100,d:['sim1','sim2','sim3','simcum'].map(k=>[SIMS[k][0].split(':')[0],S.sim[k]?S.sim[k].best:0])};
  return `<section><h1>Preparação Provão Paulista</h1>
    <p class="lead">Mantivemos os cursos por nível e adicionamos uma segunda organização: por série do Ensino Médio. Cada série tem trilha própria e um simulado separado; o cumulativo reúne os três anos.</p>
    <div class="sec"></div>${ser}
    <section class="serie" style="--h:260"><span class="chip">1ª a 3ª série</span><h2>Simulado cumulativo</h2><p class="meta">Questões sorteadas dos três anos, para acompanhar sua evolução até a classificação.</p>
      ${chart(ev)}<div class="actions"><a class="btn" href="#/praticar/simcum">Fazer simulado cumulativo</a><a class="btn ghost" href="#/banco">Banco de questões</a></div></section>
    <p class="note">Os simulados reúnem as quatro áreas (Linguagens, Matemática, Natureza e Humanas) mais questões interdisciplinares, e servem como treino. Confira o edital oficial da edição para número de questões, tempo e regras.</p></section>`;
}
function viewBanco(){
  const ds=[...new Set(BANK.map(x=>x.d))];
  const cnt=BANK.filter(x=>(!BF.d||x.d===BF.d)&&(!BF.n||x.n===BF.n)).length;
  const chip=(k,v,l,on)=>`<button class="fl${on?' on':''}" data-act="bf" data-k="${k}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
  return `<section><h1>Banco de questões</h1><p class="lead">Questões com cinco alternativas, contextualizadas, com tabelas, gráficos, mapas e explicação detalhada de cada resposta. Pratique 10 por vez.</p>
    <h2 class="sec">Disciplina</h2><div class="fls">${chip('d','','Todas',!BF.d)}${ds.map(d=>chip('d',d,d,BF.d===d)).join('')}</div>
    <h2 class="sec">Dificuldade</h2><div class="fls">${chip('n',0,'Todas',!BF.n)}${[1,2,3].map(n=>chip('n',n,NV[n],BF.n===n)).join('')}</div>
    <p class="meta" style="margin-top:20px">${cnt} questões neste filtro</p><a class="btn" href="#/praticar/banco">Praticar agora</a></section>`;
}
function pickQs(key){
  const m=SIMS[key];
  if(key==='banco') return shuffle(BANK.filter(x=>(!BF.d||x.d===BF.d)&&(!BF.n||x.n===BF.n))).slice(0,10);
  if(key==='simcum') return shuffle(BANK).slice(0,20);
  return BANK.filter(x=>x.s===m[1]).sort((a,b)=>'LMNHI'.indexOf(a.a)-'LMNHI'.indexOf(b.a));
}
function practiceView(key){
  const m=SIMS[key]; if(!m) return viewProvao();
  const sk='p:'+key;
  if(!QZ||QZ.key!==sk){ const bk=pickQs(key); QZ={key:sk,bk,order:bk.map(x=>shuffle(x.q[1].map((_,k)=>k))),ans:bk.map(()=>null),sent:false,hits:0,pct:0}; }
  const n=QZ.bk.length, back=key==='banco'?'<a href="#/banco">Banco de questões</a>':'<a href="#/provao">Provão Paulista</a>';
  if(!n) return `<article class="page"><h1>${m[0]}</h1><p class="prose">Nenhuma questão com esses filtros. <a href="#/banco">Mudar filtros</a>.</p></article>`;
  let res='';
  if(QZ.sent){
    const ar={}; QZ.bk.forEach((x,k)=>{const a=ar[x.a]||(ar[x.a]=[0,0]);a[1]++;if(QZ.ans[k]===x.q[2])a[0]++;});
    res=`<div class="res ${QZ.pct>=60?'pass':'fail'}" id="res" tabindex="-1"><h2>Você acertou ${QZ.hits} de ${n} (${QZ.pct}%)</h2><p>Veja o desempenho por área e leia a explicação de cada questão abaixo.</p>
      ${Object.keys(ar).map(a=>`<div class="ar"><span>${AREA[a]} (${ar[a][0]}/${ar[a][1]})</span>${bar(Math.round(ar[a][0]/ar[a][1]*100))}</div>`).join('')}
      <div class="actions"><button class="btn" data-act="retry">Refazer</button><a class="btn ghost" href="${key==='banco'?'#/banco':'#/provao'}">Voltar</a></div></div>`;
  }
  const ans=QZ.ans.filter(a=>a!==null).length;
  return `<article class="page"><nav class="crumb">${back} / ${m[0]}</nav><h1>${m[0]}</h1>
    ${QZ.sent?'':`<p class="prose" style="margin-bottom:1em">${n} questões de cinco alternativas. As explicações aparecem depois do envio.</p>`}${res}
    ${QZ.bk.map((x,k)=>qHtml(x.q,k,n,QZ)).join('')}
    ${QZ.sent?'':`<div class="actions"><button class="btn" data-act="submitSim" data-k="${key}">Enviar respostas</button><span class="meta" id="cnt" style="margin:0">${ans} de ${n} respondidas</span></div>`}</article>`;
}

/* =====================================================
   ROTEAMENTO E RENDERIZAÇÃO
   ===================================================== */
let lastHash=null;
function chrome(tab){
  $$('.tab').forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const my=COURSES.filter(c=>P(c.id)).length, ce=COURSES.filter(c=>P(c.id)&&P(c.id).cert).length;
  const a=$('#n-my'), b=$('#n-cert');
  a.textContent=my; a.hidden=!my; b.textContent=ce; b.hidden=!ce;
}
function render(){
  const raw=location.hash||'#/';
  const changed=raw!==lastHash;
  if(changed){ QZ=null; armReset=false; }
  lastHash=raw;
  let parts=[];
  try{ parts=raw.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent); }catch(e){}
  const [a,b,k,d]=parts;
  const c=course(b);
  let html='', tab='home';
  if(a==='meus'){ tab='meus'; html=viewMy(); }
  else if(a==='provao'){ tab='provao'; html=viewProvao(); }
  else if(a==='banco'){ tab='banco'; html=viewBanco(); }
  else if(a==='praticar'){ tab=b==='banco'?'banco':'provao'; html=practiceView(b); }
  else if(a==='certificados'){ tab='cert'; html=viewCerts(); }
  else if(a==='certificado'&&c){ tab='cert'; html=certView(c); }
  else if(a==='curso'&&c){
    const [i,j]=String(d||'').split('-').map(Number);
    if(k==='aula'&&c.lv[i]&&c.lv[i].l[j]) html=courseShell(c,{type:'aula',i,j},lessonView(c,i,j));
    else if(k==='prova'&&c.lv[Number(d)]) html=courseShell(c,{type:'prova',i:Number(d)},quizView(c,Number(d)));
    else html=courseShell(c,null,overview(c));
  } else html=viewHome();
  $('#app').innerHTML=html;
  chrome(tab);
  if(changed){
    window.scrollTo(0,0);
    const h=$('#app h1'); if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); }
  }
}

/* =====================================================
   EVENTOS
   ===================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='theme'){
    const root=document.documentElement;
    const cur=root.getAttribute('data-theme');
    const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = dark ? 'light' : 'dark';
    root.setAttribute('data-theme',S.theme); save();
  }
  else if(act==='toggleSide'){
    const s=$('#side'); const open=s.classList.toggle('open'); el.setAttribute('aria-expanded',open?'true':'false');
  }
  else if(act==='start'){ ensure(el.dataset.id); }
  else if(act==='complete'){
    const c=course(el.dataset.c), i=+el.dataset.i, j=+el.dataset.j;
    const p=ensure(c.id); p.d[i+'-'+j]=true; p.t=Date.now(); save();
    const isNew=checkCert(c);
    toast(isNew?'Curso concluído! Seu certificado está disponível.':'Aula concluída');
    const st=steps(c), idx=st.findIndex(s=>s.type==='aula'&&s.i===i&&s.j===j);
    let nx=st[idx+1];
    if(nx&&nx.type==='prova'&&!levelDone(c,nx.i)) nx=st.find(s=>s.type==='aula'&&s.i===nx.i&&!isDone(c,s));
    if(nx&&location.hash!==nx.href) location.hash=nx.href; else render();
    chrome(location.hash.indexOf('#/meus')===0?'meus':'home');
  }
  else if(act==='undo'){
    const c=course(el.dataset.c), p=ensure(c.id);
    delete p.d[el.dataset.i+'-'+el.dataset.j]; p.t=Date.now(); save(); render();
  }
  else if(act==='submitQuiz'){
    if(!QZ) return;
    const [cid,lvi]=[QZ.key.slice(0,QZ.key.lastIndexOf('-')),+QZ.key.slice(QZ.key.lastIndexOf('-')+1)];
    const c=course(cid), lv=c.lv[lvi];
    if(QZ.ans.some(a=>a===null)){ toast('Responda todas as questões antes de enviar.'); return; }
    const hits=lv.q.filter((q,k)=>QZ.ans[k]===q[2]).length;
    const pct=Math.round(hits/lv.q.length*100), ok=pct>=MIN(lv.q.length);
    const p=ensure(c.id), prev=p.q[lvi]||{best:0,ok:false};
    p.q[lvi]={best:Math.max(prev.best,pct),ok:prev.ok||ok,at:Date.now()}; p.t=Date.now(); save();
    QZ.sent=true; QZ.hits=hits; QZ.pct=pct; QZ.ok=ok; QZ.newCert=ok?checkCert(c):false;
    render();
    const r=$('#res'); if(r){ r.scrollIntoView({block:'start'}); r.focus({preventScroll:true}); }
  }
  else if(act==='bf'){ BF[el.dataset.k]=el.dataset.k==='n'?+el.dataset.v:el.dataset.v; render(); }
  else if(act==='submitSim'){
    if(!QZ||!QZ.bk) return;
    if(QZ.ans.some(a=>a===null)){ toast('Responda todas as questões antes de enviar.'); return; }
    const hits=QZ.bk.filter((x,k)=>QZ.ans[k]===x.q[2]).length, pct=Math.round(hits/QZ.bk.length*100), k=el.dataset.k;
    QZ.sent=true; QZ.hits=hits; QZ.pct=pct;
    if(k!=='banco'){ const o=S.sim[k]||{best:0,h:[]}; o.best=Math.max(o.best,pct); o.h=(o.h||[]).concat([[Date.now(),pct]]).slice(-10); S.sim[k]=o; save(); }
    render(); const r=$('#res'); if(r){ r.scrollIntoView({block:'start'}); r.focus({preventScroll:true}); }
  }
  else if(act==='retry'){ QZ=null; render(); window.scrollTo(0,0); }
  else if(act==='saveName'){
    const v=($('#nm').value||'').trim().slice(0,60);
    S.name=v; save(); toast(v?'Nome salvo':'Nome removido'); render();
  }
  else if(act==='print'){
    try{ window.print(); }catch(err){ toast('Use Ctrl+P (ou Cmd+P) para imprimir.'); }
  }
  else if(act==='reset'){
    if(!armReset){ armReset=true; render(); }
    else { S.c={}; S.sim={}; save(); armReset=false; toast('Progresso apagado'); render(); }
  }
});
document.addEventListener('change',e=>{
  const r=e.target.closest('input[data-q]'); if(!r||!QZ) return;
  QZ.ans[+r.dataset.q]=+r.value;
  const fs=r.closest('fieldset');
  $$('.opt',fs).forEach(l=>l.classList.remove('sel'));
  r.closest('.opt').classList.add('sel');
  const cnt=$('#cnt'); if(cnt) cnt.textContent=`${QZ.ans.filter(a=>a!==null).length} de ${QZ.ans.length} respondidas`;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='nm'){ e.preventDefault(); const b=$('[data-act="saveName"]'); if(b) b.click(); }
});
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
