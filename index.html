<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Cursos Completos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600&family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="shortcut icon" href="https://cdn-icons.flaticon.com/svg/3914/3914115.svg?token=exp=1789970932~hmac=1c592645b2a220a9671b77ad598a1fc8" type="image/x-icon">
<style>
*{box-sizing:border-box}
:root{
  --bg:#F5F7FC;--grid:#E2E7F3;--surface:#FFFFFF;--surface2:#EEF2FC;--ink:#152042;--muted:#56617F;--line:#CBD3E8;
  --brand:#2544D0;--on-brand:#FFFFFF;--hl:#FFE270;--hl-soft:#FFF6CC;--ok:#12804F;--ok-bg:#E2F5EB;--bad:#C92F3C;--bad-bg:#FCE7E9;
  --ui:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --doc:'Literata',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
    --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1326;--grid:#19223F;--surface:#161D36;--surface2:#1E2745;--ink:#E9EDFB;--muted:#9AA6C8;--line:#2C3760;
  --brand:#8EA2FF;--on-brand:#0E1326;--hl:#FFD84A;--hl-soft:#2B2911;--ok:#4CD08C;--ok-bg:#12301F;--bad:#FF7A85;--bad-bg:#3A1A20;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--brand)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:800;margin-bottom:.45em}
h1:focus{outline:none}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.1rem;font-weight:700}
p{margin:0 0 .8em}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1.5px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.03em;text-decoration:none;color:var(--ink);padding:0 5px;
  background:linear-gradient(transparent 56%,var(--hl) 56%,var(--hl) 90%,transparent 90%)}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface2);font-weight:700}
.n{display:inline-block;margin-left:6px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:700;text-align:center}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:28px 20px 72px}

/* Elementos comuns */
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.small{font-size:.85rem;color:var(--muted);font-weight:500;margin-bottom:.3em}
.meta{font-size:.88rem;color:var(--muted);margin:0 0 .5em}
.sec{margin:38px 0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--ink);
  background:var(--brand);color:var(--on-brand);font:700 .95rem var(--ui);cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.chip{display:inline-block;background:var(--hl);color:#152042;border:1.5px solid var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:700;margin-bottom:10px}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:99px;background:var(--surface);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hl)}
.pct{font-weight:700;font-size:.9rem;min-width:3ch;text-align:right}
.callout{border:1.5px dashed var(--ink);border-radius:12px;padding:12px 16px;margin-top:22px;background:var(--surface2)}
.callout.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.ok-pill{display:inline-block;padding:8px 14px;border-radius:99px;background:var(--ok-bg);color:var(--ok);font-weight:700;border:1.5px solid var(--ok)}

/* Cadernos (cartões de curso) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.nb{display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--surface);border:1.5px solid var(--line);border-radius:6px 16px 16px 6px;
  text-decoration:none;color:var(--ink);overflow:hidden;min-height:156px}
.nb:hover{border-color:var(--ink)}
.cover{position:relative;background:hsl(var(--h) 55% 36%);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--doc);font-weight:600;font-size:1.35rem;padding-left:14px}
.cover::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:10px;
  background:radial-gradient(circle at 5px 50%,var(--surface) 3.6px,transparent 4.4px) 0 0/10px 26px repeat-y}
.nb-b{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.nb-b .desc{color:var(--muted);font-size:.92rem;margin:4px 0 8px}
.nb-b .meta{margin-top:auto}

.resume{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--ink);
  border-radius:16px;padding:18px 22px;margin-top:26px;border-left:10px solid hsl(var(--h) 55% 40%)}
.resume>div{flex:1;min-width:240px}
.band{margin-top:44px;padding:26px 22px 30px;background:var(--hl-soft);border:1.5px dashed var(--ink);border-radius:18px}
.band .sec{margin-top:0}
.band p.lead{margin-bottom:20px}

/* Layout de documentação do curso */
.doc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;max-height:calc(100vh - 100px);overflow:auto}
.side-toggle{display:none;width:100%}
.side .back{display:block;color:var(--ink);text-decoration:none;margin-bottom:10px;font-size:1.05rem}
.side details{border-top:1px solid var(--line);padding:6px 0}
.side summary{cursor:pointer;font-weight:700;padding:6px 2px;display:flex;justify-content:space-between;gap:8px}
.cnt{font-weight:500;color:var(--muted);font-size:.85rem}
.lst{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.lst a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem}
.lst a:hover{background:var(--surface2)}
.lst a[aria-current="page"]{background:var(--hl-soft);font-weight:700;box-shadow:inset 3px 0 0 var(--ink)}
.ic{flex:none;width:18px;height:18px;margin-top:2px;color:var(--muted)}
.page{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,40px)}
.crumb{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.prose{font-family:var(--doc);font-size:1.12rem;line-height:1.75;max-width:66ch}
.prose p{margin-bottom:1em}
.vid{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1.5px dashed var(--ink);border-radius:12px;padding:16px 18px;margin:26px 0;background:var(--surface2)}
.vid p{margin:0}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.92rem}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.lv{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.lv ol{padding-left:1.2em;margin:.5em 0}
.lv li{margin-bottom:.3em}
.cta{margin:20px 0 6px}

/* Prova */
fieldset.q{border:1.5px solid var(--line);border-radius:12px;padding:14px 18px 16px;margin:16px 0;min-width:0}
fieldset.q legend{padding:0 6px;font-weight:700;color:var(--muted);font-size:.85rem}
.qt{font-weight:700;margin:2px 0 10px}
.opt{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer}
.opt input{accent-color:var(--brand)}
.opt.sel{border-color:var(--brand);background:var(--surface2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.tag{margin-left:auto;font-size:.8rem;white-space:nowrap}
.res{border:1.5px solid;border-radius:14px;padding:16px 20px;margin:0 0 18px}
.res:focus{outline:none}
.res.pass{border-color:var(--ok);background:var(--ok-bg)}
.res.fail{border-color:var(--bad);background:var(--bad-bg)}
.res h2{margin-bottom:6px}

/* Listas: meus cursos e certificados */
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.row .cover{width:56px;height:56px;border-radius:6px 12px 12px 6px;font-size:.95rem;padding-left:10px}
.row .cover::before{left:5px;width:8px;background:radial-gradient(circle at 4px 50%,var(--surface) 2.8px,transparent 3.6px) 0 0/8px 20px repeat-y}
.row h3 a{color:var(--ink);text-decoration:none}
.empty{background:var(--surface);border:1.5px dashed var(--ink);border-radius:16px;padding:28px;text-align:center}
.namebox{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}
.namebox label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.namebox input{font:500 1rem var(--ui);padding:10px 12px;border:1.5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);min-width:260px;max-width:100%}
.namebox>div{flex:1;min-width:240px;max-width:420px}
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cm{background:#FFFCF2;color:#152042;border:2px solid #152042;border-radius:10px;padding:18px;box-shadow:inset 0 0 0 5px #FFFCF2,inset 0 0 0 6.5px #152042;display:flex;flex-direction:column;gap:4px}
.cm h3{font-family:var(--doc);font-size:1.15rem}
.cm p{margin:0;font-size:.88rem;color:#3a4566}
.cm .btn{margin-top:10px;align-self:flex-start;background:transparent;color:#152042}
.danger{margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}

/* Certificado */
.cert{position:relative;background:#FFFCF2;color:#152042;padding:clamp(28px,6vw,64px);text-align:center;font-family:var(--doc);
  border:2px solid #152042;box-shadow:inset 0 0 0 10px #FFFCF2,inset 0 0 0 12px #152042;line-height:1.5}
.cert p{margin:0 0 .6em}
.c-brand{font-family:var(--ui);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.c-title{font-size:clamp(1.6rem,4.5vw,2.6rem)!important;margin:.4em 0 1em!important}
.c-name{font-size:clamp(1.6rem,4.5vw,2.4rem);font-style:italic;font-weight:600;border-bottom:1.5px solid #152042;display:inline-block;padding:0 .6em .1em;margin:.2em 0 .8em!important}
.c-course{font-size:clamp(1.3rem,3.5vw,1.9rem);font-weight:600;background:linear-gradient(transparent 58%,#FFE270 58%,#FFE270 92%,transparent 92%);display:inline-block;padding:0 .3em;margin-bottom:.9em!important}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:34px;font-size:.9rem}
.seal{width:84px;height:84px;border-radius:50%;border:3px solid #152042;background:#FFE270;display:grid;place-items:center;font-family:var(--ui);font-weight:800;font-size:.95rem;color:#152042}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}

@media (max-width:900px){
  .doc{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .side-toggle{display:block}
  .side .side-body{display:none;margin-top:12px}
  .side.open .side-body{display:block}
}
@media (max-width:600px){
  .top-in{padding:8px 12px;gap:8px}
  .logo{font-size:1.2rem}
  .tab{padding:8px 10px;font-size:.92rem}
  main{padding:20px 14px 60px}
  .row{grid-template-columns:56px minmax(0,1fr)}
  .row>.btn{grid-column:1/-1}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.noprint,.toast{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .cert{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

</header>
<main id="app"></main>

<script>

const COURSES = [

/* ---------- Cursos comuns: do zero ao nível universitário ---------- */

mk('provao-linguagens','Provão Paulista: Linguagens e Redação','provao',312,'Aa','Interpretação de textos, gramática em contexto, literatura e redação no estilo da prova.',[
 {l:[
  ['Como se preparar: estratégia de prova','Conheça o formato da prova e treine com questões anteriores. Leia o enunciado e os textos de apoio antes das alternativas, elimine as incorretas e controle o tempo por questão. Confira sempre o edital vigente.','como estudar para o Provão Paulista dicas'],
  ['Interpretação de textos: ideia central','Identifique o assunto, a tese e os argumentos do texto. Sublinhe conectivos e palavras-chave. A resposta correta está apoiada no texto, não em opinião pessoal.','interpretação de texto vestibular ideia central aula'],
  ['Gêneros textuais do dia a dia','Notícias informam fatos, charges criticam com humor, tirinhas e memes unem imagem e texto. Reconhecer o gênero mostra a finalidade, o público e a linguagem esperada.','gêneros textuais charge notícia crônica aula']],
  q:[
  ['Qual é a melhor estratégia ao começar uma questão de interpretação?',['ler só as alternativas','ler o enunciado e o texto de apoio antes das alternativas','marcar sempre a mesma letra','pular todas as questões de leitura'],1],
  ['A ideia central de um texto é:',['um detalhe secundário','o assunto principal que ele desenvolve','o nome da editora','apenas o último parágrafo'],1],
  ['Uma charge costuma combinar:',['humor e crítica social','apenas dados estatísticos','instruções de receita','artigos de lei'],0],
  ['A principal finalidade de uma notícia é:',['expressar a opinião pessoal do autor','informar fatos recentes','ensinar uma receita','narrar uma ficção'],1]]},
 {l:[
  ['Inferência e sentido das palavras','Inferir é concluir o que não está dito de forma explícita, usando pistas do texto. O sentido de uma palavra depende do contexto: a mesma palavra pode ter significados diferentes.','inferência e sentido das palavras aula vestibular'],
  ['Variação linguística e norma-padrão','A língua varia conforme região, idade, época e situação. Variedades não são erros: cabe adequar a linguagem ao contexto. A norma-padrão é exigida em situações formais e na redação.','variação linguística aula'],
  ['Coesão e coerência','Coesão é a ligação entre as partes do texto por conectivos e pronomes. Coerência é a lógica das ideias. "Portanto" indica conclusão, "porém" indica oposição e "porque" indica causa.','coesão e coerência textual aula']],
  q:[
  ['Inferir um sentido em um texto significa:',['copiar um trecho','concluir informações implícitas a partir de pistas','ignorar o contexto','traduzir palavras'],1],
  ['A variação linguística é:',['um erro que deve sempre ser corrigido','a diferença no uso da língua conforme região, época e situação','apenas o uso de gírias','exclusiva da escrita'],1],
  ['O conectivo "portanto" indica:',['oposição','conclusão','causa','tempo'],1],
  ['A coerência de um texto está relacionada a:',['uso correto de vírgulas','lógica e sentido entre as ideias','letra bonita','tamanho do texto'],1]]},
 {l:[
  ['Romantismo e Realismo','O Romantismo idealiza o amor, a natureza e a pátria (José de Alencar, Castro Alves). O Realismo critica a sociedade com olhar objetivo, e Machado de Assis é seu principal nome no Brasil.','Romantismo Realismo literatura brasileira aula'],
  ['Modernismo brasileiro','Iniciado com a Semana de Arte Moderna de 1922, o Modernismo rompeu com padrões tradicionais, valorizou a língua falada e a identidade nacional. Destacam-se Mário de Andrade e Oswald de Andrade.','Modernismo brasileiro Semana de 22 aula'],
  ['Figuras e funções da linguagem','Metáfora, ironia, hipérbole e metonímia aparecem em textos literários e publicitários. As funções (referencial, emotiva, conativa, poética, entre outras) mostram o objetivo da comunicação.','funções da linguagem figuras de linguagem aula']],
  q:[

  ['A ironia consiste em:',['dizer o contrário do que se quer expressar','exagerar uma ideia','repetir sons','comparar usando "como"'],0],
  ['Oswald de Andrade é um autor do:',['Barroco','Modernismo','Arcadismo','Naturalismo'],1]]},
 {l:[
  ['Redação: estrutura dissertativo-argumentativa','O texto tem introdução (tema e tese), desenvolvimento (argumentos) e conclusão. Defenda um ponto de vista com clareza, mantenha o tema e use linguagem formal. A redação é aplicada na 3ª série.','redação dissertativo-argumentativa estrutura aula'],
  ['Argumentação e repertório sociocultural','Repertório são conhecimentos (fatos históricos, obras, dados) que sustentam os argumentos. Escolha informações pertinentes ao tema e explique como elas comprovam a sua tese.','repertório sociocultural redação argumentos aula'],

/* =====================================================
   ESTADO E PERSISTÊNCIA (localStorage protegido)
   ===================================================== */
const KEY = 'trilha:v1';
let S = {name:'',theme:'',c:{}};
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const o = JSON.parse(raw); if(o && typeof o === 'object'){ S = Object.assign(S,o); if(!S.c) S.c = {}; } }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
if(S.theme) document.documentElement.setAttribute('data-theme',S.theme);

/* =====================================================
   UTILITÁRIOS
   ===================================================== */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const course = id => COURSES.find(c=>c.id===id);
const P = id => S.c[id] || null;
const fmt = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function ensure(id){
  if(!S.c[id]){ S.c[id]={s:Date.now(),t:Date.now(),d:{},q:{},cert:null}; save(); }
  return S.c[id];
}

/* =====================================================
   REGRAS DE PROGRESSO
   ===================================================== */
function steps(c){
  const r=[];
  c.lv.forEach((lv,i)=>{
    lv.l.forEach((l,j)=>r.push({type:'aula',i,j,href:`#/curso/${c.id}/aula/${i}-${j}`,label:`Aula ${j+1}: ${l[0]}`}));
    r.push({type:'prova',i,href:`#/curso/${c.id}/prova/${i}`,label:`Prova do nível ${LV[i]}`});
  });
  return r;
}
function isDone(c,s){
  const p=P(c.id); if(!p) return false;
  return s.type==='aula' ? !!p.d[s.i+'-'+s.j] : !!(p.q[s.i] && p.q[s.i].ok);
}
function stats(c){
  const st=steps(c); const done=st.filter(s=>isDone(c,s)).length;
  return {total:st.length,done,pct:Math.round(done/st.length*100)};
}
function nextStep(c){ return steps(c).find(s=>!isDone(c,s)) || null; }
function levelDone(c,i){ const p=P(c.id); return !!p && c.lv[i].l.every((_,j)=>p.d[i+'-'+j]); }
function hours(c){
  const l=c.lv.reduce((a,x)=>a+x.l.length,0), q=c.lv.length;
  return Math.max(1,Math.round((l*40+q*20)/60));
}
function checkCert(c){
  const p=P(c.id); if(!p||p.cert) return false;
  const s=stats(c);
  if(s.done===s.total){
    p.cert={at:Date.now(),code:'TRL-'+c.id.replace(/[^a-z]/g,'').slice(0,4).toUpperCase()+'-'+Math.random().toString(36).slice(2,8).toUpperCase()};
    save(); return true;
  }
  return false;
}

/* =====================================================
   COMPONENTES
   ===================================================== */
function bar(pct){
  return `<div class="prog"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso do curso"><i style="width:${pct}%"></i></div><span class="pct">${pct}%</span></div>`;
}
function card(c){
  const p=P(c.id), s=stats(c);
  const nL=c.lv.reduce((a,l)=>a+l.l.length,0);
  return `<a class="nb" href="#/curso/${c.id}" style="--h:${c.h}">
    <div class="cover" aria-hidden="true">${esc(c.sym)}</div>
    <div class="nb-b">
      <h3>${esc(c.t)}</h3>
      <p class="desc">${esc(c.d)}</p>
      <p class="meta">${c.lv.length} níveis, ${nL} aulas, ${c.lv.length} provas${p&&p.cert?' (concluído)':''}</p>
      ${p?bar(s.pct):''}
    </div></a>`;
}

function viewHome(){
  const going=COURSES.filter(c=>P(c.id)&&!P(c.id).cert&&nextStep(c)).sort((a,b)=>P(b.id).t-P(a.id).t);
  let h=`<section><h1>O que você vai estudar hoje?</h1>
    <p class="lead">Cada curso é uma trilha em quatro níveis. Assista às videoaulas, conclua as aulas, faça a prova de cada nível e ganhe o certificado no final.</p></section>`;
  if(going.length){
    const c=going[0], n=nextStep(c), s=stats(c);
    h+=`<section class="resume" style="--h:${c.h}"><div><p class="small">Continue de onde parou</p><h2>${esc(c.t)}</h2><p class="meta">${esc(n.label)}</p>${bar(s.pct)}</div><a class="btn" href="${n.href}">Continuar</a></section>`;
  }
  h+=`<h2 class="sec">Matérias do Ensino Médio</h2><div class="grid">${COURSES.filter(c=>c.cat==='materia').map(card).join('')}</div>`;
  h+=`<section class="band"><h2 class="sec">Foco no Provão Paulista</h2>
    <p class="lead">O Provão Paulista Seriado acompanha o Ensino Médio (1ª, 2ª e 3ª séries) e dá acesso a vagas em instituições públicas paulistas, como USP, Unesp, Unicamp, Univesp e Fatecs. Estes cursos cobrem as áreas da prova. Datas e regras mudam a cada edição, então confira o edital oficial.</p>
    <div class="grid">${COURSES.filter(c=>c.cat==='provao').map(card).join('')}</div></section>`;
  return h;
}

function row(c){
  const p=P(c.id), s=stats(c), n=nextStep(c);
  const fin=!!p.cert;
  return `<article class="row" style="--h:${c.h}">
    <div class="cover" aria-hidden="true">${esc(c.sym)}</div>
    <div>
      ${c.cat==='provao'?'<span class="chip">Provão Paulista</span>':''}
      <h3><a href="#/curso/${c.id}">${esc(c.t)}</a></h3>
      <p class="meta">${fin?'Curso concluído em '+fmt(p.cert.at):(n?'Próximo passo: '+esc(n.label):'Curso concluído')}</p>
      ${bar(s.pct)}
    </div>
    <a class="btn ${fin?'ghost':''}" href="${fin?'#/certificado/'+c.id:(n?n.href:'#/curso/'+c.id)}">${fin?'Ver certificado':'Continuar'}</a>
  </article>`;
}
function viewMy(){
  const list=COURSES.filter(c=>P(c.id)).sort((a,b)=>P(b.id).t-P(a.id).t);
  let h=`<h1>Meus cursos</h1>`;
  if(!list.length){
    return h+`<div class="empty"><h2>Você ainda não iniciou nenhum curso</h2><p class="lead" style="margin:8px auto 18px">Escolha uma trilha, abra a primeira aula e ela aparece aqui para você continuar quando quiser.</p><a class="btn" href="#/">Escolher um curso</a></div>`;
  }
  const going=list.filter(c=>!P(c.id).cert), done=list.filter(c=>P(c.id).cert);
  if(going.length) h+=`<h2 class="sec">Em andamento</h2><div class="rows">${going.map(row).join('')}</div>`;
  if(done.length) h+=`<h2 class="sec">Concluídos</h2><div class="rows">${done.map(row).join('')}</div>`;
  return h;
}

function nameBox(){
  return `<div class="namebox noprint"><div><label for="nm">Nome que aparece nos certificados</label><input id="nm" type="text" maxlength="60" autocomplete="name" value="${esc(S.name)}" placeholder="Seu nome completo"></div><button class="btn" data-act="saveName">Salvar nome</button></div>`;
}
let armReset=false;
function viewCerts(){
  const earned=COURSES.filter(c=>P(c.id)&&P(c.id).cert).sort((a,b)=>P(b.id).cert.at-P(a.id).cert.at);
  const going=COURSES.filter(c=>P(c.id)&&!P(c.id).cert).sort((a,b)=>P(b.id).t-P(a.id).t);
  let h=`<h1>Certificados</h1><p class="lead">Você ganha um certificado ao concluir todas as aulas e ser aprovado nas provas dos quatro níveis de um curso.</p>${nameBox()}`;
  h+=`<h2 class="sec">Conquistados</h2>`;
  if(earned.length){
    h+=`<div class="certs">${earned.map(c=>{const p=P(c.id);return `<article class="cm"><h3>${esc(c.t)}</h3><p>Emitido em ${fmt(p.cert.at)}</p><p>Código ${esc(p.cert.code)}</p><a class="btn" href="#/certificado/${c.id}">Ver certificado</a></article>`;}).join('')}</div>`;
  } else {
    h+=`<div class="empty"><p style="margin:0">Seu primeiro certificado sai quando você terminar todas as etapas de um curso.</p></div>`;
  }
  if(going.length){
    h+=`<h2 class="sec">Próximos certificados</h2><div class="rows">${going.map(row).join('')}</div>`;
  }
  h+=`<div class="danger"><p class="meta">Seu progresso fica salvo neste navegador.</p><button class="btn ghost" data-act="reset">${armReset?'Confirmar: apagar todo o meu progresso':'Apagar meu progresso'}</button></div>`;
  return h;
}

function certView(c){
  const p=P(c.id);
  if(!p||!p.cert){
    return `<div class="page"><h1>Certificado indisponível</h1><p class="prose">Conclua todas as aulas e as provas de ${esc(c.t)} para emitir o certificado.</p><a class="btn" href="#/curso/${c.id}">Voltar ao curso</a></div>`;
  }
  return `${nameBox()}
  <div class="actions noprint" style="margin-bottom:18px"><button class="btn" data-act="print">Imprimir ou salvar em PDF</button><a class="btn ghost" href="#/certificados">Todos os certificados</a></div>
  <article class="cert">
    <p class="c-brand">Trilha</p>
    <h1 class="c-title">Certificado de conclusão</h1>
    <p>Certificamos que</p>
    <p class="c-name">${esc(S.name||'Seu nome aqui')}</p>
    <p>concluiu o curso</p>
    <p class="c-course">${esc(c.t)}</p>
    <p>com todas as aulas concluídas e aprovação nas provas dos quatro níveis, em carga horária estimada de ${hours(c)} horas.</p>
    <div class="c-foot"><span>${fmt(p.cert.at)}</span><div class="seal" aria-hidden="true">Trilha</div><span>Código ${esc(p.cert.code)}</span></div>
  </article>`;
}

/* ---------- Curso: barra lateral ---------- */
function side(c,act){
  const p=P(c.id)||{d:{},q:{}}, s=stats(c), n=nextStep(c);
  const openLv = act ? act.i : (n ? n.i : 0);
  const levels=c.lv.map((lv,i)=>{
    const dn=lv.l.filter((_,j)=>p.d[i+'-'+j]).length;
    const all=dn===lv.l.length, ok=p.q[i]&&p.q[i].ok;
    const cur=(t,j)=> act&&act.type===t&&act.i===i&&(t==='prova'||act.j===j) ? ' aria-current="page"':'';
    return `<details ${i===openLv||(n&&n.i===i)?'open':''}><summary><span>${LV[i]}</span><span class="cnt">${dn}/${lv.l.length}</span></summary><div class="lst">
      ${lv.l.map((l,j)=>`<a href="#/curso/${c.id}/aula/${i}-${j}"${cur('aula',j)}>${p.d[i+'-'+j]?ICON.done:ICON.todo}<span>${esc(l[0])}</span></a>`).join('')}
      <a href="#/curso/${c.id}/prova/${i}"${cur('prova')}>${ok?ICON.done:(all?ICON.quiz:ICON.lock)}<span>Prova do nível</span></a>
    </div></details>`;
  }).join('');
  return `<aside class="side" id="side">
    <button class="btn ghost side-toggle" data-act="toggleSide" aria-expanded="false">Trilha do curso: ${s.pct}% concluído</button>
    <div class="side-body">
      <a class="back" href="#/curso/${c.id}"><strong>${esc(c.t)}</strong></a>
      ${bar(s.pct)}
      <div style="height:10px"></div>
      ${levels}
    </div></aside>`;
}
function courseShell(c,act,content){ return `<div class="doc">${side(c,act)}<div>${content}</div></div>`; }

function overview(c){
  const p=P(c.id), s=stats(c), n=nextStep(c);
  const lvHtml=c.lv.map((lv,i)=>{
    const pp=p||{d:{},q:{}};
    const dn=lv.l.filter((_,j)=>pp.d[i+'-'+j]).length, qz=pp.q[i];
    const st=qz&&qz.ok?`Prova aprovada (melhor nota: ${qz.best}%)`:(levelDone(c,i)?'Prova liberada':'Prova liberada após concluir as aulas');
    return `<section class="lv"><h3>${LV[i]}</h3><p class="meta">${dn} de ${lv.l.length} aulas concluídas</p>
      <ol>${lv.l.map((l,j)=>`<li><a href="#/curso/${c.id}/aula/${i}-${j}">${esc(l[0])}</a>${pp.d[i+'-'+j]?' (feita)':''}</li>`).join('')}</ol>
      <p class="meta" style="margin:0"><a href="#/curso/${c.id}/prova/${i}">${st}</a></p></section>`;
  }).join('');
  const certBox = p&&p.cert
    ? `<div class="callout ok"><strong>Certificado emitido.</strong> <a href="#/certificado/${c.id}">Ver certificado</a></div>`
    : `<div class="callout">Conclua todas as aulas e as quatro provas para emitir o certificado deste curso.</div>`;
  const cta = p&&p.cert && !n ? `<a class="btn" href="#/certificado/${c.id}">Ver certificado</a>`
    : (n ? `<a class="btn" data-act="start" data-id="${c.id}" href="${n.href}">${p?'Continuar':'Iniciar curso'}: ${esc(n.label)}</a>` : '');
  return `<article class="page">
    <nav class="crumb"><a href="#/">Cursos</a> / ${esc(c.t)}</nav>
    ${c.cat==='provao'?'<span class="chip">Provão Paulista</span>':''}
    <h1>${esc(c.t)}</h1>
    <p class="prose">${esc(c.d)}</p>
    ${bar(s.pct)}
    <p class="meta" style="margin-top:6px">${s.done} de ${s.total} etapas concluídas (aulas e provas)</p>
    <div class="cta">${cta}</div>
    <h2 style="margin-top:30px">Trilha do curso</h2>
    <div class="lv-grid">${lvHtml}</div>
    ${certBox}
  </article>`;
}

function lessonView(c,i,j){
  const l=c.lv[i].l[j], p=ensure(c.id), key=i+'-'+j, done=!!p.d[key];
  const direct=/^https?:\/\//.test(l[2]);
  const url=direct?l[2]:'https://www.youtube.com/results?search_query='+encodeURIComponent(l[2]);
  const st=steps(c), idx=st.findIndex(s=>s.type==='aula'&&s.i===i&&s.j===j);
  const prev=st[idx-1], next=st[idx+1];
  const attrs=`data-c="${c.id}" data-i="${i}" data-j="${j}"`;
  return `<article class="page">
    <nav class="crumb" aria-label="Você está aqui"><a href="#/">Cursos</a> / <a href="#/curso/${c.id}">${esc(c.t)}</a> / ${LV[i]}</nav>
    <p class="small">Aula ${j+1} de ${c.lv[i].l.length}</p>
    <h1>${esc(l[0])}</h1>
    <div class="prose"><p>${esc(l[1])}</p></div>
    <div class="vid"><div><strong>Videoaula no YouTube</strong><p class="meta">${direct?'Abre o vídeo indicado para esta aula.':'Abre uma busca no YouTube com aulas sobre este tema. Escolha o professor de que mais gostar.'}</p></div>
      <a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Assistir no YouTube</a></div>
    <div class="actions">${done
      ? `<span class="ok-pill">Aula concluída</span>${next?`<a class="btn" href="${next.href}">Ir para: ${esc(next.label)}</a>`:''}<button class="btn ghost" data-act="undo" ${attrs}>Desmarcar</button>`
      : `<button class="btn" data-act="complete" ${attrs}>Concluir aula e continuar</button>`}</div>
    <div class="pn"><span>${prev?`<a href="${prev.href}">Anterior: ${esc(prev.label)}</a>`:''}</span><span>${next?`<a href="${next.href}">Próximo: ${esc(next.label)}</a>`:''}</span></div>
  </article>`;
}

/* ---------- Prova ---------- */
let QZ=null;
function quizView(c,i){
  const lv=c.lv[i], p=ensure(c.id);
  const head=`<nav class="crumb"><a href="#/">Cursos</a> / <a href="#/curso/${c.id}">${esc(c.t)}</a> / ${LV[i]}</nav>`;
  if(!levelDone(c,i)){
    const pend=lv.l.map((l,j)=>({l,j})).filter(x=>!p.d[i+'-'+x.j]);
    return `<article class="page">${head}<h1>Prova do nível ${LV[i]}</h1><p class="prose">Conclua todas as aulas deste nível para liberar a prova. Faltam:</p>
      <ul class="prose">${pend.map(x=>`<li><a href="#/curso/${c.id}/aula/${i}-${x.j}">${esc(x.l[0])}</a></li>`).join('')}</ul></article>`;
  }
  const key=c.id+'-'+i;
  if(!QZ||QZ.key!==key) QZ={key,order:lv.q.map(q=>shuffle(q[1].map((_,k)=>k))),ans:lv.q.map(()=>null),sent:false,hits:0,pct:0,ok:false,newCert:false};
  const qs=lv.q.map((q,k)=>{
    const opts=QZ.order[k].map(o=>{
      const chosen=QZ.ans[k]===o; let cls='opt', tag='';
      if(QZ.sent){
        if(o===q[2]){cls+=' ok';tag='<b class="tag">Resposta correta</b>';}
        else if(chosen){cls+=' bad';tag='<b class="tag">Sua resposta</b>';}
      } else if(chosen) cls+=' sel';
      return `<label class="${cls}"><input type="radio" name="q${k}" value="${o}" data-q="${k}" ${chosen?'checked':''} ${QZ.sent?'disabled':''}><span>${esc(q[1][o])}</span>${tag}</label>`;
    }).join('');
    return `<fieldset class="q"><legend>Questão ${k+1} de ${lv.q.length}</legend><p class="qt">${esc(q[0])}</p>${opts}</fieldset>`;
  }).join('');
  let res='';
  if(QZ.sent){
    const st=steps(c), idx=st.findIndex(s=>s.type==='prova'&&s.i===i), nx=st[idx+1];
    const pc=P(c.id);
    let act='';
    if(QZ.ok){
      if(nx) act+=`<a class="btn" href="${nx.href}">Continuar: ${esc(nx.label)}</a>`;
      if(pc&&pc.cert) act+=` <a class="btn ${nx?'ghost':''}" href="#/certificado/${c.id}">Ver certificado</a>`;
    } else {
      act=`<button class="btn" data-act="retry">Refazer prova</button> <a class="btn ghost" href="#/curso/${c.id}">Rever as aulas</a>`;
    }
    res=`<div class="res ${QZ.ok?'pass':'fail'}" id="res" tabindex="-1"><h2>${QZ.ok?'Aprovado':'Ainda não foi dessa vez'}</h2>
      <p>Você acertou ${QZ.hits} de ${lv.q.length} questões (${QZ.pct}%). A nota mínima é 70%.${QZ.ok?'':' Revise o conteúdo e tente de novo.'}</p>
      ${QZ.newCert?'<p><strong>Você concluiu o curso e conquistou o certificado.</strong></p>':''}
      <div class="actions">${act}</div></div>`;
  }
  const answered=QZ.ans.filter(a=>a!==null).length;
  return `<article class="page">${head}<h1>Prova do nível ${LV[i]}</h1>
    <p class="prose" style="margin-bottom:1em">${lv.q.length} questões de múltipla escolha sobre o conteúdo do nível. Para ser aprovado, acerte pelo menos 70%.</p>
    ${res}${qs}
    ${QZ.sent?'':`<div class="actions"><button class="btn" data-act="submitQuiz">Enviar respostas</button><span class="meta" id="cnt" style="margin:0">${answered} de ${lv.q.length} respondidas</span></div>`}
  </article>`;
}

/* =====================================================
   ROTEAMENTO E RENDERIZAÇÃO
   ===================================================== */
let lastHash=null;
function chrome(tab){
  $$('.tab').forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const my=COURSES.filter(c=>P(c.id)).length, ce=COURSES.filter(c=>P(c.id)&&P(c.id).cert).length;
  const a=$('#n-my'), b=$('#n-cert');
  a.textContent=my; a.hidden=!my; b.textContent=ce; b.hidden=!ce;
}
function render(){
  const raw=location.hash||'#/';
  const changed=raw!==lastHash;
  if(changed){ QZ=null; armReset=false; }
  lastHash=raw;
  let parts=[];
  try{ parts=raw.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent); }catch(e){}
  const [a,b,k,d]=parts;
  const c=course(b);
  let html='', tab='home';
  if(a==='meus'){ tab='meus'; html=viewMy(); }
  else if(a==='certificados'){ tab='cert'; html=viewCerts(); }
  else if(a==='certificado'&&c){ tab='cert'; html=certView(c); }
  else if(a==='curso'&&c){
    const [i,j]=String(d||'').split('-').map(Number);
    if(k==='aula'&&c.lv[i]&&c.lv[i].l[j]) html=courseShell(c,{type:'aula',i,j},lessonView(c,i,j));
    else if(k==='prova'&&c.lv[Number(d)]) html=courseShell(c,{type:'prova',i:Number(d)},quizView(c,Number(d)));
    else html=courseShell(c,null,overview(c));
  } else html=viewHome();
  $('#app').innerHTML=html;
  chrome(tab);
  if(changed){
    window.scrollTo(0,0);
    const h=$('#app h1'); if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); }
  }
}

/* =====================================================
   EVENTOS
   ===================================================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  if(act==='theme'){
    const root=document.documentElement;
    const cur=root.getAttribute('data-theme');
    const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = dark ? 'light' : 'dark';
    root.setAttribute('data-theme',S.theme); save();
  }
  else if(act==='toggleSide'){
    const s=$('#side'); const open=s.classList.toggle('open'); el.setAttribute('aria-expanded',open?'true':'false');
  }
  else if(act==='start'){ ensure(el.dataset.id); }
  else if(act==='complete'){
    const c=course(el.dataset.c), i=+el.dataset.i, j=+el.dataset.j;
    const p=ensure(c.id); p.d[i+'-'+j]=true; p.t=Date.now(); save();
    const isNew=checkCert(c);
    toast(isNew?'Curso concluído! Seu certificado está disponível.':'Aula concluída');
    const st=steps(c), idx=st.findIndex(s=>s.type==='aula'&&s.i===i&&s.j===j);
    let nx=st[idx+1];
    if(nx&&nx.type==='prova'&&!levelDone(c,nx.i)) nx=st.find(s=>s.type==='aula'&&s.i===nx.i&&!isDone(c,s));
    if(nx&&location.hash!==nx.href) location.hash=nx.href; else render();
    chrome(location.hash.indexOf('#/meus')===0?'meus':'home');
  }
  else if(act==='undo'){
    const c=course(el.dataset.c), p=ensure(c.id);
    delete p.d[el.dataset.i+'-'+el.dataset.j]; p.t=Date.now(); save(); render();
  }
  else if(act==='submitQuiz'){
    if(!QZ) return;
    const [cid,lvi]=[QZ.key.slice(0,QZ.key.lastIndexOf('-')),+QZ.key.slice(QZ.key.lastIndexOf('-')+1)];
    const c=course(cid), lv=c.lv[lvi];
    if(QZ.ans.some(a=>a===null)){ toast('Responda todas as questões antes de enviar.'); return; }
    const hits=lv.q.filter((q,k)=>QZ.ans[k]===q[2]).length;
    const pct=Math.round(hits/lv.q.length*100), ok=pct>=70;
    const p=ensure(c.id), prev=p.q[lvi]||{best:0,ok:false};
    p.q[lvi]={best:Math.max(prev.best,pct),ok:prev.ok||ok,at:Date.now()}; p.t=Date.now(); save();
    QZ.sent=true; QZ.hits=hits; QZ.pct=pct; QZ.ok=ok; QZ.newCert=ok?checkCert(c):false;
    render();
    const r=$('#res'); if(r){ r.scrollIntoView({block:'start'}); r.focus({preventScroll:true}); }
  }
  else if(act==='retry'){ QZ=null; render(); window.scrollTo(0,0); }
  else if(act==='saveName'){
    const v=($('#nm').value||'').trim().slice(0,60);
    S.name=v; save(); toast(v?'Nome salvo':'Nome removido'); render();
  }
  else if(act==='print'){
    try{ window.print(); }catch(err){ toast('Use Ctrl+P (ou Cmd+P) para imprimir.'); }
  }
  else if(act==='reset'){
    if(!armReset){ armReset=true; render(); }
    else { S.c={}; save(); armReset=false; toast('Progresso apagado'); render(); }
  }
});
document.addEventListener('change',e=>{
  const r=e.target.closest('input[data-q]'); if(!r||!QZ) return;
  QZ.ans[+r.dataset.q]=+r.value;
  const fs=r.closest('fieldset');
  $$('.opt',fs).forEach(l=>l.classList.remove('sel'));
  r.closest('.opt').classList.add('sel');
  const cnt=$('#cnt'); if(cnt) cnt.textContent=`${QZ.ans.filter(a=>a!==null).length} de ${QZ.ans.length} respondidas`;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='nm'){ e.preventDefault(); const b=$('[data-act="saveName"]'); if(b) b.click(); }
});
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
